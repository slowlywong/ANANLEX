    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LawLex </title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
      /* ===== BRAND ===== */
.brand{display:flex;align-items:center;gap:12px;}
.brand-logo{
  width:46px;height:46px;flex:none;border-radius:14px;
  display:grid;place-items:center;font-size:1.5rem;
  background:linear-gradient(135deg,var(--primary),#8b5cf6);
  box-shadow:0 6px 16px color-mix(in srgb,var(--primary) 40%,transparent),
             inset 0 1px 0 rgba(255,255,255,.35);
}
.brand-text{display:flex;flex-direction:column;align-items:flex-start;line-height:1;}
.brand-text h1{
  margin:0;font-family:'Inter','Sarabun',sans-serif;
  font-size:1.6rem;font-weight:800;letter-spacing:-.03em;
  background:linear-gradient(90deg,var(--primary),#8b5cf6);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
}
.brand-credit{
  margin-top:5px;padding:0;
  font-size:.7rem;font-weight:400;letter-spacing:.08em;
  color:var(--text-sub);
}
      /* ===== UI POLISH LAYER ===== */
:root{
  --bg:#f5f7fb; --card-bg:#fff; --primary:#3b4cca; --secondary:#16a34a;
  --accent:#f59e0b; --danger:#dc2626; --text-main:#1e2433; --text-sub:#6b7280;
  --radius:18px; --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
  --shadow-hover:0 2px 4px rgba(16,24,40,.06),0 14px 32px rgba(16,24,40,.12);
  --line:#e5e8f0;
}
[data-theme="dark"]{
  --bg:#0d1117; --card-bg:#161b26; --primary:#7c8cff; --secondary:#22c55e;
  --danger:#f87171; --line:#262d3d; --disabled:#262d3d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-hover:0 14px 32px rgba(0,0,0,.5);
}
body{
  --card:var(--card-bg); --bd:var(--line); --mut:var(--text-sub); --fg:var(--text-main);
  --ac:var(--primary); --ok:var(--secondary); --bad:var(--danger);
}
html{-webkit-text-size-adjust:100%;}
body{font-family:'Sarabun','Noto Sans Thai',sans-serif;font-size:16px;line-height:1.6;padding:0 16px 96px;}
.container{max-width:640px;}
button{-webkit-tap-highlight-color:transparent;}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:2px;}

/* header ติดขอบบน */
.header{position:sticky;top:0;z-index:100;margin:0 -16px 20px;padding:12px 16px;
  background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);}
.header h1{font-size:1.15rem;letter-spacing:-.01em;}
.header-actions{display:flex;gap:6px;}
.icon-btn{min-width:40px;height:40px;padding:0 10px;border-radius:12px;border:1px solid var(--line);
  background:var(--card-bg);color:var(--text-main);font:inherit;font-weight:700;cursor:pointer;transition:.15s;}
.icon-btn:hover{border-color:var(--primary);}

/* ปุ่มย้อนกลับเป็น pill */
.back-nav{padding:8px 14px;margin-bottom:16px;border-radius:999px;background:var(--card-bg);
  border:1px solid var(--line);font-size:.9rem;transition:.15s;}
.back-nav:hover{border-color:var(--primary);}

/* การ์ด/ปุ่มเมนู */
.content-block,.deka-card{border:1px solid var(--line);}
.main-btn{border:1px solid var(--line);min-height:76px;padding:18px 20px;
  transition:transform .18s,box-shadow .18s,border-color .18s;}
.main-btn:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--primary);}
.main-btn:active{transform:scale(.98);}
.main-btn h3{font-size:1rem;}
.icon-box{width:48px;height:48px;background:color-mix(in srgb,var(--primary) 10%,var(--card-bg));}

/* ปุ่มทั่วไป */
.btn{min-height:46px;transition:transform .15s,filter .15s;}
.btn:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px);}
.btn:active:not(:disabled){transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 65%,#8b5cf6));}

/* แท็บ/ค้นหา/แท็ก */
.tab-row{background:var(--bg);padding:4px;border-radius:14px;}
.tab-btn{border:none;background:transparent;border-radius:10px;min-height:42px;transition:.15s;}
.tab-btn.active{background:var(--card-bg);box-shadow:var(--shadow);color:var(--primary);}
.search-box{border-radius:14px;min-height:46px;}
.tag{border-radius:999px;padding:3px 12px;}
.progress-container{height:8px;}
.progress-bar{background:linear-gradient(90deg,var(--primary),var(--secondary));}
.flashcard{border:1px solid var(--line);}
.fab{bottom:20px;right:16px;box-shadow:var(--shadow-hover);}

/* แถบความคืบหน้าบนหน้าแรก */
.mini-bar{height:5px;border-radius:99px;background:var(--line);margin-top:8px;overflow:hidden;}
.mini-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--secondary));border-radius:99px;}

/* เคารพผู้ที่ปิดแอนิเมชัน */
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
        :root {
            --bg: #f4f7f9; --card-bg: #ffffff; --primary: #1a2a6c;
            --secondary: #27ae60; --accent: #f39c12; --danger: #e74c3c;
            --text-main: #2c3e50; --text-sub: #7f8c8d;
            --shadow: 0 10px 30px rgba(0,0,0,0.08); --radius: 20px; --disabled: #e2e8f0;
        }
        .pre-line { white-space: pre-line !important; }

        [data-theme="dark"] {
            --bg: #0f172a; --card-bg: #1e293b; --text-main: #f1f5f9;
            --text-sub: #94a3b8; --primary: #38bdf8;
            --shadow: 0 10px 30px rgba(0,0,0,0.3); --disabled: #334155;
        }
        body { font-family:'Sarabun',sans-serif; background:var(--bg); color:var(--text-main); margin:0; padding:20px; transition:all 0.3s; }
        .container { max-width:600px; margin:0 auto; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; }
        .header h1 { font-size:1.4rem; font-weight:800; color:var(--primary); margin:0; }
        .back-nav { cursor:pointer; color:var(--primary); font-weight:bold; margin-bottom:20px; display:inline-block; border:none; background:none; font-family:inherit; font-size:1rem; }
        .screen { display:none; animation:fadeIn 0.4s ease; }
        .active { display:block; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .menu-grid { display:grid; grid-template-columns:1fr; gap:15px; }
        @media(min-width:800px){ .menu-grid{ grid-template-columns:repeat(2,1fr); } }
        .main-btn { background:var(--card-bg); padding:25px; border-radius:var(--radius); box-shadow:var(--shadow); border:none; cursor:pointer; display:flex; align-items:center; text-align:left; width:100%; transition:transform 0.2s; color:var(--text-main); }
        .main-btn:hover { transform:translateY(-5px); }
        .icon-box { width:50px; height:50px; background:var(--bg); border-radius:12px; margin-right:20px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; flex-shrink:0; }
        .content-block { background:var(--card-bg); border-radius:var(--radius); padding:25px; margin-bottom:20px; box-shadow:var(--shadow); }
        .tag { display:inline-block; padding:4px 10px; border-radius:8px; font-size:0.75rem; font-weight:bold; margin-bottom:10px; }
        .tag-blue  { background:#e1f5fe; color:#0288d1; }
        .tag-green { background:#e8f5e9; color:#2e7d32; }
        .tag-orange { background:#fff3e0; color:#e65100; }
        .tag-purple { background:#f3e5f5; color:#7b1fa2; }
        .progress-container { width:100%; height:6px; background:#e2e8f0; border-radius:10px; margin-bottom:20px; }
        .progress-bar { height:100%; background:var(--secondary); border-radius:10px; width:0%; transition:0.3s; }
        .card-wrapper { min-height:420px; }

        /* ===== FLASH CARD ===== */
        .flashcard {
            background:var(--card-bg); border-radius:25px; box-shadow:var(--shadow);
            padding:30px 35px; box-sizing:border-box; min-height:420px;
            display:flex; flex-direction:column; cursor:pointer;
        }
        .fc-header {
            display:flex; align-items:flex-start; gap:16px;
            padding-bottom:18px; border-bottom:2px solid var(--disabled); margin-bottom:20px;
        }
        .fc-section-badge {
            font-size:2rem; font-weight:900; color:var(--primary);
            line-height:1; white-space:nowrap; font-family:'Inter',sans-serif;
        }
        .fc-title-area { flex:1; }
        .fc-law-name { font-size:1.15rem; font-weight:700; color:var(--text-main); margin:0 0 4px; }
        .fc-subtitle { font-size:0.8rem; color:var(--text-sub); margin:0; }
        .fc-body { flex:1; }
        .fc-body-text {
            background:var(--bg); border-radius:12px; padding:16px 18px;
            font-size:0.95rem; line-height:2; color:var(--text-main);
            border-left:4px solid var(--primary);
            white-space: pre-line;
        }
        .fc-elements { display:flex; flex-direction:column; gap:10px; }
        .fc-elem-row {
            display:flex; align-items:flex-start; gap:12px;
            background:var(--bg); border-radius:10px; padding:12px 14px;
        }
        .fc-elem-num {
            width:26px; height:26px; border-radius:50%; background:var(--primary);
            color:#fff; font-size:0.8rem; font-weight:bold;
            display:flex; align-items:center; justify-content:center; flex-shrink:0;
        }
        .fc-elem-text { font-size:0.9rem; line-height:1.7; }
        .fc-elem-label { font-weight:700; color:var(--primary); }
        .fc-hint { text-align:center; margin-top:20px; font-size:0.8rem; color:var(--text-sub); }
        .page-dot-row { display:flex; justify-content:center; gap:8px; margin-top:16px; }
        .page-dot { width:8px; height:8px; border-radius:50%; background:var(--disabled); transition:0.3s; }
        .page-dot.active { background:var(--primary); width:20px; border-radius:4px; }

        /* ===== DEKA ===== */
        .deka-card { background:var(--card-bg); border-radius:var(--radius); padding:25px; box-shadow:var(--shadow); margin-bottom:16px; }
        .deka-principle-box {
            background:var(--bg); border-radius:12px; padding:14px 16px;
            border-left:4px solid var(--accent); margin:14px 0;
            font-size:0.9rem; line-height:1.8; font-style:italic; color:var(--text-main);
            white-space: pre-line;
        }
        .deka-section-label { font-size:0.75rem; font-weight:700; color:var(--text-sub); text-transform:uppercase; letter-spacing:0.05em; margin:14px 0 6px; }
        .deka-body-text { font-size:0.9rem; line-height:1.8; margin:6px 0 0; white-space: pre-line; }
        .quiz-question { font-weight:700; font-size:1rem; margin:10px 0 14px; line-height:1.6; }
        .quiz-option {
            display:block; width:100%; padding:13px 16px; margin:8px 0;
            border:2px solid var(--disabled); border-radius:12px; text-align:left;
            cursor:pointer; background:var(--card-bg); font-family:inherit;
            color:var(--text-main); font-size:0.9rem; transition:all 0.2s; box-sizing:border-box;
        }
        .quiz-option:hover:not(:disabled) { border-color:var(--primary); background:var(--bg); }
        .quiz-option.correct { border-color:var(--secondary)!important; background:#e8f5e9!important; color:#1b5e20!important; font-weight:bold; }
        .quiz-option.wrong   { border-color:var(--danger)!important; background:#fce4ec!important; color:#880e4f!important; }
        .quiz-option:disabled { cursor:default; }
        .quiz-result { margin-top:12px; padding:12px 16px; border-radius:10px; font-size:0.88rem; line-height:1.7; display:none; }
        .quiz-result.show { display:block; }
        .quiz-result.ok  { background:#e8f5e9; color:#1b5e20; border-left:4px solid var(--secondary); }
        .quiz-result.no  { background:#fce4ec; color:#880e4f; border-left:4px solid var(--danger); }

        /* ===== IRAC WRITING ===== */
        .irac-input {
            width:100%; height:260px; padding:15px; border-radius:12px;
            border:2px solid #eee; font-family:'Sarabun'; font-size:1rem;
            margin-top:10px; box-sizing:border-box;
            background:var(--card-bg); color:var(--text-main); line-height:1.8; resize:vertical;
        }
        .btn { border:none; padding:15px; border-radius:15px; font-weight:bold; cursor:pointer; font-size:0.9rem; transition:0.3s; }
        .btn-primary   { background:var(--primary); color:white; }
        .btn-secondary { background:var(--disabled); color:var(--text-sub); }
        .btn:disabled  { opacity:0.5; cursor:not-allowed; }
        .score-table { width:100%; border-collapse:collapse; margin-top:10px; font-size:0.88rem; }
        .score-table th { background:var(--bg); padding:8px 12px; text-align:left; font-weight:700; }
        .score-table td { padding:8px 12px; border-top:1px solid var(--disabled); vertical-align:top; }
        .score-table .pts { text-align:right; font-weight:bold; white-space:nowrap; }
        .pts-full{color:var(--secondary)} .pts-mid{color:var(--accent)} .pts-fail{color:var(--danger)}
        .deka-ref { font-size:0.78rem; color:var(--text-sub); background:var(--bg); border-left:3px solid var(--primary); padding:8px 12px; border-radius:0 8px 8px 0; margin-top:10px; white-space: pre-line; }
        .criteria-box { background:var(--bg); border-radius:12px; padding:14px 18px; margin-bottom:16px; font-size:0.82rem; line-height:1.7; border-left:4px solid var(--primary); }
        .criteria-box strong { color:var(--primary); }
        .spinner { display:inline-block; width:18px; height:18px; border:3px solid rgba(255,255,255,0.3); border-radius:50%; border-top-color:#fff; animation:spin 1s linear infinite; margin-right:8px; vertical-align:middle; }
        @keyframes spin { to{transform:rotate(360deg)} }

        .model-answer-text { margin:4px 0 12px; white-space: pre-line; line-height:1.9; }

        #loading-overlay { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; z-index:999; }
        .load-spinner { width:48px; height:48px; border:5px solid var(--disabled); border-top-color:var(--primary); border-radius:50%; animation:spin 0.9s linear infinite; }
        .load-error { color:var(--danger); font-weight:bold; text-align:center; max-width:360px; line-height:1.8; }
        .load-error code { display:block; background:var(--disabled); border-radius:8px; padding:8px 12px; font-size:0.8rem; margin-top:8px; color:var(--text-main); }
        .retry-btn { padding:10px 28px; background:var(--primary); color:#fff; border:none; border-radius:12px; cursor:pointer; font-family:inherit; font-size:0.95rem; font-weight:bold; }

        /* ===== SEARCH ===== */
        .search-box { width:100%; padding:13px 16px; border-radius:12px; border:2px solid var(--disabled); font-family:inherit; font-size:0.92rem; box-sizing:border-box; background:var(--card-bg); color:var(--text-main); }
        .search-box:focus { outline:none; border-color:var(--primary); }
        .search-result-item { padding:14px 16px; cursor:pointer; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; gap:10px; border:none; width:100%; text-align:left; font-family:inherit; background:var(--bg); border-radius:14px; color:var(--text-main); font-size:0.9rem; }
        .search-result-item:hover { transform:translateY(-2px); }
        .search-empty { color:var(--text-sub); font-size:0.85rem; padding:6px 2px; }
        .tag.clickable { cursor:pointer; transition:0.2s; }
        .tag.clickable:hover { filter:brightness(0.92); text-decoration:underline; }
        .fc-elem-label.clickable, .fc-section-badge.clickable { cursor:pointer; }
        .fc-elem-label.clickable:hover, .fc-section-badge.clickable:hover { text-decoration:underline; }
        .deka-nav-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px; }

        /* ===== FLOATING SHORTCUT BUTTON ===== */
        .fab {
            position:fixed; bottom:24px; right:24px; z-index:200;
            background:var(--primary); color:#fff; border:none;
            padding:14px 24px; border-radius:30px; font-weight:800;
            font-size:0.95rem; font-family:inherit; box-shadow:var(--shadow);
            cursor:pointer; transition:transform 0.2s;
        }
        .fab:hover { transform:translateY(-3px); }
        .fab:active { transform:translateY(0); }

        /* ========================================================
           NEW: grouped homepage, mindmap modal, tabs, tree overview
           ======================================================== */
        .group-block { margin-bottom:20px; }
        .group-header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
        .group-header h3 { margin:0; font-size:1.05rem; }
        .btn-mindmap {
            border:none; background:var(--bg); color:var(--primary); font-weight:700;
            padding:8px 14px; border-radius:12px; cursor:pointer; white-space:nowrap; font-family:inherit; font-size:0.82rem;
        }
        .btn-mindmap:hover { filter:brightness(0.95); }

        .modal-overlay {
            display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45);
            align-items:center; justify-content:center; z-index:500; padding:20px;
        }
        .modal-overlay.active { display:flex; }
        .modal-box { max-width:480px; width:100%; max-height:80vh; overflow-y:auto; }
        .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; }
        .modal-close { border:none; background:var(--bg); border-radius:10px; width:32px; height:32px; cursor:pointer; font-size:1rem; flex-shrink:0; }

        .mindmap-tree, .mindmap-tree ul { list-style:none; margin:0; padding-left:18px; border-left:2px solid var(--disabled); }
        .mindmap-tree.root-list { padding-left:0; border-left:none; }
        .mindmap-tree li { margin:8px 0; }
        .tree-label { font-weight:600; }
        .tree-label.clickable { cursor:pointer; color:var(--primary); }
        .tree-label.clickable:hover { text-decoration:underline; }
        .tree-section-tag { color:var(--text-sub); font-style:normal; font-size:0.85em; font-weight:400; }

        .tab-row { display:flex; gap:8px; margin-bottom:12px; }
        .tab-btn {
            flex:1; border:2px solid var(--disabled); background:var(--card-bg); color:var(--text-sub);
            padding:10px 8px; border-radius:12px; font-family:inherit; font-weight:700; font-size:0.82rem; cursor:pointer;
        }
        .tab-btn.active { border-color:var(--primary); color:var(--primary); background:var(--bg); }
        .tab-panel { display:none; }
        .tab-panel.active { display:block; }
        .accordion { margin-bottom:8px; }
        .accordion summary { cursor:pointer; font-weight:700; padding:10px 4px; color:var(--primary); }
        .accordion-body { display:flex; flex-direction:column; gap:8px; padding-top:6px; }
        .accordion-nested { margin-left:14px; border-left:2px solid var(--disabled); padding-left:10px; margin-bottom:6px; }
        .accordion-nested summary { font-size:0.85rem; color:var(--text-main); padding:8px 4px; }
        .deka-stat-badge { font-size:0.9rem; font-weight:700; }

        /* ===== OVERVIEW TREE (บรรพ > ลักษณะ > หมวด > ส่วน > มาตรา) ===== */
        .ov-book { margin-bottom:18px; }
        .ov-book-title { font-size:1rem; font-weight:800; color:var(--primary); margin:0 0 10px; padding-bottom:6px; border-bottom:2px solid var(--disabled); }
        .ov-title-node { margin-bottom:8px; border:none; }
        .ov-title-summary {
            cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center;
            background:var(--bg); border-radius:12px; padding:12px 14px; font-weight:700; font-size:0.92rem;
        }
        .ov-title-summary::-webkit-details-marker { display:none; }
        .ov-title-summary .ov-caret { transition:transform 0.2s; color:var(--text-sub); font-size:0.8rem; }
        .ov-title-node[open] > .ov-title-summary .ov-caret { transform:rotate(90deg); }
        .ov-title-summary .ov-range { font-weight:400; color:var(--text-sub); font-size:0.78rem; margin-left:8px; }
        .ov-title-body { padding:10px 4px 4px 14px; }
        .ov-chapter { margin-bottom:6px; }
        .ov-chapter-summary { cursor:pointer; list-style:none; font-size:0.85rem; font-weight:700; color:var(--text-main); padding:8px 4px; }
        .ov-chapter-summary::-webkit-details-marker { display:none; }
        .ov-chapter-body { padding:4px 0 4px 14px; }
        .ov-part-label { font-size:0.8rem; font-weight:700; color:var(--text-sub); margin:8px 0 4px; }
        .ov-section-btn {
            display:inline-block; margin:3px 4px 3px 0; padding:5px 10px; border-radius:8px;
            background:var(--card-bg); border:1px solid var(--disabled); color:var(--primary);
            font-size:0.8rem; cursor:pointer; font-family:inherit;
        }
        .ov-section-btn:hover { background:var(--primary); color:#fff; border-color:var(--primary); }
    </style>
</head>
<body data-theme="light">

<div id="loading-overlay">
    <div class="load-spinner"></div>
    <p id="load-msg" style="color:var(--text-sub);margin:0;font-style:italic;">Scio me nihil scire</p>
</div>

/* ============================================================
   UTILITY
   ============================================================ */
function nl(text) {
  if (!text) return "";
  return String(text).replace(/\\n/g, "\n").replace(/\n/g, "<br>");
}
function escJS(str) {
  return String(str == null ? "" : str).replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/\n/g, " ");
}
function escHTML(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ============================================================
   DATA (โหลดจาก data.json ที่ผู้ใช้มีอยู่แล้ว)
   ============================================================ */
let DATA = {};

/* ============================================================
   ROUTE / STATE
   ============================================================ */
const ROUTE_KEY = "slb_route_v1";

const DEFAULT_ROUTE = {
  screen: "screen-category",
  catKey: null,
  cardIdx: 0,
  pageIdx: 0,
  dekaIdx: 0,
  writingIdx: 0,
  flashTab: "keyword",
  dekaTab: "keyword",
};

let route = { ...DEFAULT_ROUTE };
let currentFontSize = 1.0;

let pendingFlashQuery = null;
let pendingDekaQuery = null;

function loadRouteFromStorage() {
  try {
    const raw = sessionStorage.getItem(ROUTE_KEY);
    if (raw) return { ...DEFAULT_ROUTE, ...JSON.parse(raw) };
  } catch (e) {}
  return { ...DEFAULT_ROUTE };
}

function persistRoute() {
  try { sessionStorage.setItem(ROUTE_KEY, JSON.stringify(route)); } catch (e) {}
}

function go(partial, opts) {
  opts = opts || {};
  route = { ...route, ...partial };
  persistRoute();
  if (opts.replace) window.history.replaceState(route, "");
  else window.history.pushState(route, "");
  render();
}

window.addEventListener("popstate", function (e) {
  route = e.state ? { ...DEFAULT_ROUTE, ...e.state } : loadRouteFromStorage();
  persistRoute();
  render();
});

/* ============================================================
   BOOT
   ============================================================ */
async function loadData() {
  try {
    const res = await fetch("data.json");
    if (!res.ok) throw new Error(`HTTP ${res.status} — ไม่พบไฟล์`);
    const json = await res.json();
    DATA = json;
    if (!DATA.categories) DATA.categories = {};
    if (!DATA.groups) DATA.groups = {};

    route = window.history.state && window.history.state.screen
      ? { ...DEFAULT_ROUTE, ...window.history.state }
      : loadRouteFromStorage();

    if (route.catKey && !DATA.categories[route.catKey]) {
      route = { ...DEFAULT_ROUTE };
    }

    window.history.replaceState(route, "");
    document.getElementById("loading-overlay").style.display = "none";
    document.getElementById("app").style.display = "block";
    render();
  } catch (err) {
    document.getElementById("loading-overlay").innerHTML = `
      <div class="load-error">❌ โหลด data.json ไม่สำเร็จ<br>
      <code>${escHTML(err.message)}</code>
      ตรวจสอบว่า <b>data.json</b> อยู่ในโฟลเดอร์เดียวกับ HTML<br>
      และเปิดผ่าน <b>Live Server</b> (Go Live) ใน VS Code</div>
      <button class="retry-btn" onclick="location.reload()">🔄 ลองใหม่</button>`;
  }
}

  dqInjectCSS();
  let ov = document.getElementById("dq-ov");
  if (!ov) { ov = document.createElement("div"); ov.id = "dq-ov"; document.body.appendChild(ov); }
  ov.dataset.theme = document.body.dataset.theme === "dark" ? "dark" : "light";
  ov.innerHTML = html;
}
function dqClose(){ const ov = document.getElementById("dq-ov"); if (ov) ov.remove(); }

/* แถบปุ่มบนหน้ารายการฎีกา */
function addDekaPracticeBar(){
  dqInjectCSS();
  const old = document.getElementById("deka-practice-bar");
  if (old) old.remove();
  const title = document.getElementById("deka-list-title");
  if (!title) return;
  const bar = document.createElement("div");
  bar.id = "deka-practice-bar";
  bar.className = "dq-bar";
  bar.innerHTML = `
    <button class="primary" onclick="dqStart(false)">▶ เริ่มฝึกฝน</button>
    <button onclick="dqStart(true)">🔁 ทวนที่เคยผิด</button>
    <button onclick="dqStats()">📊 สถิติ</button>`;
  title.insertAdjacentElement("afterend", bar);
}

function dqStart(onlyWrong){
  const cat = DATA.categories[route.catKey];
  let list = (cat.dekaList || []).filter(d => d.quiz && d.quiz.options && d.quiz.options.length);
  const st = dqLoad();
  if (onlyWrong) list = list.filter(d => (st[d.title] || {}).wrong > 0);
  if (!list.length) { alert(onlyWrong ? "ยังไม่มีเรื่องที่เคยตอบผิด 🎉" : "ไม่มีข้อสอบฎีกาในหมวดนี้"); return; }
  dqS = { list: dqShuffle(list), i: 0, right: 0, wrong: 0, wrongItems: [], picked: null, order: null };
  dqPrepare();
  dqRender();
}

function dqPrepare(){
  const s = dqS;
  if (s.i >= s.list.length) return;
  s.order = dqShuffle(s.list[s.i].quiz.options.map((text, idx) => ({ text, idx })));
  s.picked = null;
}

function dqRender(){
  const s = dqS;
  if (s.i >= s.list.length) return dqSummary();
  const d = s.list[s.i], q = d.quiz, answered = s.picked !== null;
  const LET = ["ก", "ข", "ค", "ง", "จ", "ฉ"];
  const isRight = answered && s.order[s.picked].idx === q.correct;

  const opts = s.order.map((o, k) => {
    let cls = "";
    if (answered) {
      if (o.idx === q.correct) cls = "ok";
      else if (k === s.picked) cls = "bad";
      else cls = "dim";
    }
    return `<button class="dq-opt ${cls}" ${answered ? "disabled" : ""} onclick="dqAnswer(${k})">
      <span class="dq-key">${LET[k] || k + 1}</span><span>${dqEsc(o.text)}</span></button>`;
  }).join("");

  const chips = (d.tags || []).map(t => `<span class="dq-chip">${dqEsc(t)}</span>`).join("");

  dqOverlay(`<div class="dq-wrap">
    <div class="dq-top">
      <button class="dq-x" onclick="dqClose()">✕</button>
      <div class="dq-prog"><div style="width:${(s.i / s.list.length) * 100}%"></div></div>
      <div class="dq-score">${s.i + 1}/${s.list.length} · ✅${s.right} ❌${s.wrong}</div>
    </div>
    <div class="dq-card">
      <div class="dq-title">${dqEsc(d.title)}${d.statute ? " · 📖 " + dqEsc(d.statute) : ""}</div>
      ${chips ? `<div class="dq-chips">${chips}</div>` : ""}
      ${d.facts ? `<div class="dq-facts">${dqEsc(d.facts)}</div>` : ""}
      <p class="dq-q">${dqEsc(q.question)}</p>
      ${opts}
      ${answered ? `<div class="dq-fb" style="--c:var(${isRight ? "--ok" : "--bad"})">
        <b>${isRight ? "✅ ถูกต้อง" : "❌ ยังไม่ถูก"}</b>
        <div style="white-space:pre-wrap;margin-top:6px;">${dqEsc(q.explanation || d.principle || "")}</div></div>` : ""}
    </div>
  </div>
  ${answered ? `<div class="dq-foot"><button class="dq-next" onclick="dqNext()">
    ${s.i + 1 >= s.list.length ? "ดูสรุปผล 🏁" : "ข้อถัดไป ➡"}</button></div>` : ""}`);
}

function dqAnswer(k){
  const s = dqS;
  if (!s || s.picked !== null) return;
  const d = s.list[s.i];
  const ok = s.order[k].idx === d.quiz.correct;
  s.picked = k;
  const st = dqLoad();
  const rec = st[d.title] || { right: 0, wrong: 0, last: null };
  if (ok) { rec.right++; s.right++; } else { rec.wrong++; s.wrong++; s.wrongItems.push(d); }
  rec.last = ok ? "right" : "wrong";
  st[d.title] = rec;
  dqSave(st);
  dqRender();
}

function dqNext(){ dqS.i++; dqPrepare(); dqRender(); }

function dqSummary(){
  const s = dqS, total = s.right + s.wrong;
  const pct = total ? Math.round((s.right / total) * 100) : 0;
  dqOverlay(`<div class="dq-wrap">
    <div class="dq-card">
      <div class="dq-big">
        <div class="dq-ring" style="--p:${pct}"><span>${pct}%</span></div>
        <div style="font-size:1.1rem;">ถูก <b style="color:var(--ok)">${s.right}</b> · ผิด <b style="color:var(--bad)">${s.wrong}</b></div>
      </div>
      ${s.wrongItems.length
        ? `<h3 style="margin:8px 0 0;">เรื่องที่ควรทบทวน</h3>` + s.wrongItems.map(d => `<div class="dq-li"><span>${dqEsc(d.title)}</span></div>`).join("")
        : `<p style="text-align:center;">ตอบถูกทุกข้อ 🎉</p>`}
      <div class="dq-row">
        <button class="dq-btn p" onclick="dqStart(false)">▶ เล่นใหม่</button>
        <button class="dq-btn" onclick="dqStart(true)">🔁 ทวนที่เคยผิด</button>
        <button class="dq-btn" onclick="dqStats()">📊 สถิติรวม</button>
        <button class="dq-btn" onclick="dqClose()">ปิด</button>
      </div>
    </div></div>`);
}

function dqStats(){
  const st = dqLoad();
  const rows = Object.entries(st).map(([title, r]) => ({ title, ...r })).sort((a, b) => b.wrong - a.wrong);
  const R = rows.reduce((n, r) => n + r.right, 0), W = rows.reduce((n, r) => n + r.wrong, 0);
  dqOverlay(`<div class="dq-wrap">
    <div class="dq-top">
      <button class="dq-x" onclick="dqClose()">✕</button>
      <h2 style="margin:0;flex:1;">📊 สถิติฎีกาสำคัญ</h2>
    </div>
    <div class="dq-card">
      <p style="margin-top:0;">รวม <b style="color:var(--ok)">✅ ${R}</b> · <b style="color:var(--bad)">❌ ${W}</b> ${R + W ? `· ${Math.round(R / (R + W) * 100)}%` : ""}</p>
      ${rows.length ? rows.map(r => `<div class="dq-li">
        <div><div>${dqEsc(r.title)}</div><small>ล่าสุด: ${r.last === "right" ? "ถูก" : r.last === "wrong" ? "ผิด" : "-"}</small></div>
        <div style="display:flex;gap:6px;"><span class="dq-pill r">✅ ${r.right}</span><span class="dq-pill w">❌ ${r.wrong}</span></div>
      </div>`).join("") : "<p>ยังไม่มีสถิติ กดเริ่มฝึกฝนได้เลย</p>"}
      <div class="dq-row">
        <button class="dq-btn p" onclick="dqStart(false)">▶ เริ่มฝึกฝน</button>
        <button class="dq-btn d" onclick="dqReset()">🗑 ล้างสถิติหมวดนี้</button>
        <button class="dq-btn" onclick="dqExport()">⬇ Export</button>
<button class="dq-btn" onclick="dqImport()">⬆ Import</button>
      </div>
    </div></div>`);
}
function dqReset(){ if (confirm("ล้างสถิติของหมวดนี้ทั้งหมด?")) { dqSave({}); dqStats(); } }

/* คีย์ลัด: กด 1-4 เลือกข้อ, Enter/Space ไปข้อถัดไป */
document.addEventListener("keydown", e => {
  if (!document.getElementById("dq-ov") || !dqS || dqS.i >= dqS.list.length) return;
  if (dqS.picked === null && /^[1-6]$/.test(e.key) && dqS.order[+e.key - 1]) dqAnswer(+e.key - 1);
  else if (dqS.picked !== null && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); dqNext(); }
});

    const gKey = cat.group || "_ungrouped";
    if (!groups[gKey]) {
      const def = groupDefs[gKey] || {};
      groups[gKey] = {
    key: gKey,
    label: def.label || (
        gKey === "criminal"
            ? "กฎหมายอาญา"
            : "กฎหมายแพ่งและพาณิชย์"
    ),
    icon: def.icon || (
        gKey === "criminal"
            ? "➤"
            : "➤"
    ),
    mindmapNodes: def.mindmapNodes || null,
    catKeys: []
};
      
    }
    groups[gKey].catKeys.push(key);

  return groups;
}

function dqProgress(key, cat){
  let st = {}; try { st = JSON.parse(localStorage.getItem("dekaStats_" + key) || "{}"); } catch(e){}
  const rows = Object.values(st);
  const total = (cat.dekaList || []).length;
  const R = rows.reduce((n, r) => n + r.right, 0), W = rows.reduce((n, r) => n + r.wrong, 0);
  return { total, done: rows.length, pct: R + W ? Math.round(R / (R + W) * 100) : null };
}
function dqExport(){
  const out = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith("dekaStats_")) { try { out[k] = JSON.parse(localStorage.getItem(k)); } catch(e){} }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: "application/json" }));
  a.download = "deka-stats-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click(); URL.revokeObjectURL(a.href);
}
function dqImport(){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "application/json";
  inp.onchange = async () => {
    try {
      const data = JSON.parse(await inp.files[0].text());
      Object.entries(data).forEach(([k, v]) => {
        if (!k.startsWith("dekaStats_")) return;
        const cur = JSON.parse(localStorage.getItem(k) || "{}");
        Object.entries(v).forEach(([t, r]) => {
          const c = cur[t];
          cur[t] = c ? { right: Math.max(c.right, r.right), wrong: Math.max(c.wrong, r.wrong), last: r.last } : r;
        });
        localStorage.setItem(k, JSON.stringify(cur));
      });
      alert("นำเข้าสำเร็จ"); dqStats();
    } catch(e) { alert("ไฟล์ไม่ถูกต้อง"); }
  };
  inp.click();
}

/* ============================================================
   ภาพรวมวิชา (บรรพ > ลักษณะ > หมวด > ส่วน > มาตรา)
   ------------------------------------------------------------
   ค่า default จะแสดง "เฉพาะหัวข้อลักษณะ" เท่านั้น (ยุบ/พับไว้)
   ผู้ใช้ต้องแตะที่ชื่อลักษณะเพื่อขยายดู หมวด/ส่วน/มาตรา ข้างใน
   ถ้า cat.overview.root ถูกกำหนดไว้ตรงๆ ใน data.json จะใช้ค่านั้น
   ถ้าไม่มี จะ auto-generate จาก flashCards โดยอ่าน field ต่อไปนี้
   ของแต่ละการ์ด (ทุก field เป็น optional, มี fallback):
     card.book      -> ชื่อบรรพ  (เช่น "บรรพ 1 หลักทั่วไป")
     card.category  -> ชื่อลักษณะ (เช่น "ลักษณะ 2 บุคคล")   [ใช้ field เดิม]
     card.chapter   -> ชื่อหมวด   (เช่น "หมวด 1 บุคคลธรรมดา")
     card.part      -> ชื่อส่วน   (เช่น "ส่วนที่ 1 สภาพบุคคล")
     card.section   -> เลขมาตรา (ใช้ jump ไป Flash Card)

   ฟังก์ชัน buildOverviewRoot / renderOverviewTree ชุดนี้ยังถูกใช้ซ้ำ
   เป็นต้นไม้ "ค้นหาตามหมวด/ลักษณะ" ของ Flash Card (แท็บ browse)
   เพื่อให้พฤติกรรมเหมือนกันทุกจุด: โชว์ "ลักษณะ" ก่อน (ยุบ)
   แตะแล้วค่อยขยายเป็น หมวด/ส่วน/มาตรา (ก็ยุบซ้อนอยู่ข้างในเช่นกัน)
   ============================================================ */
function buildOverviewRoot(cat) {
  if (cat.overview && cat.overview.root) return cat.overview.root;

  const NO_BOOK = "ทั้งหมด";
  const bookMap = new Map(); // book -> Map(title -> Map(chapter -> Map(part -> [cards])))

  (cat.flashCards || []).forEach(card => {
    const bookKey    = card.book || NO_BOOK;
    const titleKey   = card.category || "ไม่ระบุลักษณะ";
    const chapterKey = card.chapter || "";
    const partKey    = card.part || "";

    if (!bookMap.has(bookKey)) bookMap.set(bookKey, new Map());
    const titleMap = bookMap.get(bookKey);

    if (!titleMap.has(titleKey)) titleMap.set(titleKey, new Map());
    const chapterMap = titleMap.get(titleKey);

    if (!chapterMap.has(chapterKey)) chapterMap.set(chapterKey, new Map());
    const partMap = chapterMap.get(chapterKey);

    if (!partMap.has(partKey)) partMap.set(partKey, []);
    partMap.get(partKey).push(card);
  });

  const books = [...bookMap.entries()].map(([bookLabel, titleMap]) => {
    const titles = [...titleMap.entries()].map(([titleLabel, chapterMap]) => {
      const chapters = [...chapterMap.entries()].map(([chapterLabel, partMap]) => {
        const parts = [...partMap.entries()].map(([partLabel, cards]) => ({
          label: partLabel,
          sections: cards.map(c => ({
            label: `${c.title || ""}`.trim() || `มาตรา ${c.section}`,
            section: c.section,
          })),
        }));
        // ช่วงมาตราของหมวดนี้ (สำหรับแสดงบอกช่วงเลขมาตรา)
        const allSecs = parts.flatMap(p => p.sections.map(s => s.section)).filter(Boolean);
        return { label: chapterLabel, parts, range: sectionRangeLabel(allSecs) };
      });
      const allSecsTitle = chapters.flatMap(c => c.parts.flatMap(p => p.sections.map(s => s.section))).filter(Boolean);
      return { label: titleLabel, chapters, range: sectionRangeLabel(allSecsTitle) };
    });
    return { label: bookLabel, titles, showBookLabel: bookLabel !== NO_BOOK };
  });

  return { books };
}

function sectionRangeLabel(secs) {
  if (!secs || secs.length === 0) return "";
  // เรียงตามตัวเลขมาตรา (รองรับรูปแบบ "193/1" ด้วยการเทียบเป็นตัวเลขคร่าวๆ)
  const toNum = s => parseFloat(String(s).replace("/", "."));
  const sorted = [...secs].sort((a, b) => toNum(a) - toNum(b));
  const first = sorted[0], last = sorted[sorted.length - 1];
  return first === last ? `ม.${first}` : `ม.${first}–${last}`;
}

/**
 * เรนเดอร์ต้นไม้ภาพรวม: แสดงเฉพาะหัวข้อ "ลักษณะ" ตอนเปิดหน้า (พับหมวด/ส่วน/มาตราไว้)
 * ใช้ <details>/<summary> ของ native HTML เพื่อ toggle เปิด-ปิดโดยไม่ต้องเขียน JS state เพิ่ม
 * ใช้ร่วมกันทั้งหน้า "ภาพรวมวิชา" และแท็บ "ค้นหาตามหมวด/ลักษณะ" ของ Flash Card
 */
function renderOverviewTree(root) {
  const books = root.books || [];
  return books.map(book => `
    <div class="ov-book">
      ${book.showBookLabel ? `<div class="ov-book-title">${escHTML(book.label)}</div>` : ""}
      ${book.titles.map(renderTitleNode).join("")}
    </div>`).join("");
}

function renderTitleNode(title) {
  return `
    <details class="ov-title-node">
      <summary class="ov-title-summary">
        <span>${escHTML(title.label)} ${title.range ? `<span class="ov-range">${escHTML(title.range)}</span>` : ""}</span>
        <span class="ov-caret">▶</span>
      </summary>
      <div class="ov-title-body">
        ${title.chapters.map(renderChapterNode).join("")}
      </div>
    </details>`;
}

function renderChapterNode(chapter) {
  // ถ้าไม่มีชื่อหมวด (การ์ดไม่ได้ระบุ chapter) ให้ข้ามชั้นหมวด แสดงส่วน/มาตราตรงๆ
  const hasChapterLabel = Boolean(chapter.label);
  const body = chapter.parts.map(renderPartNode).join("");
  if (!hasChapterLabel) return body;
  return `
    <details class="ov-chapter">
      <summary class="ov-chapter-summary">
        ${escHTML(chapter.label)} ${chapter.range ? `<span class="ov-range">${escHTML(chapter.range)}</span>` : ""}
      </summary>
      <div class="ov-chapter-body">${body}</div>
    </details>`;
}

function renderPartNode(part) {
  const label = part.label ? `<div class="ov-part-label">${escHTML(part.label)}</div>` : "";
  const btns = part.sections.map(s => `
    <button type="button" class="ov-section-btn" onclick="jumpToSectionFromOverview('${escJS(s.section)}')" title="ไปดู Flash Card มาตรานี้">
      ม.${escHTML(s.section)}
    </button>`).join("");
  return `<div>${label}<div>${btns}</div></div>`;
}

function buildOverviewScreen(cat) {
  document.getElementById("overview-title").innerText = `🗺️ ภาพรวมวิชา: ${cat.label}`;
  const root = buildOverviewRoot(cat);

function jumpToSectionFromOverview(section) {

/* ------------------------------------------------------------
   DEKA — แท็บ "ค้นหาตามหมวด/ลักษณะ"
   โชว์สถิติเป็นหมวดก่อน (เรียงจากจำนวนฎีกามากไปน้อย)
   หมวดที่ยังไม่ระบุ ("ไม่ระบุหมวด") จะอยู่ล่างสุดเสมอ ไม่ว่าจะมีกี่เรื่อง
   แตะหมวดเพื่อขยาย แล้วข้างในจะถูกยุบซ้อนอีกชั้นตาม "มาตรา" ที่เกี่ยวข้อง
   ------------------------------------------------------------ */
function getDekaSectionsForItem(d) {
  const secs = new Set();
  extractSectionsFromText(d.statute).forEach(n => secs.add(n));
  extractSectionsFromText(d.principle).forEach(n => secs.add(n));
  extractSectionsFromText(d.facts).forEach(n => secs.add(n));
  extractSectionsFromText(d.holding).forEach(n => secs.add(n));
  (d.tags || []).forEach(t => { if (/^\d+(\/\d+)?$/.test(String(t).trim())) secs.add(String(t).trim()); });
  return [...secs];
}

function buildDekaBrowseTree(cat) {
  const list = cat.dekaList || [];
  const NO_CAT = "ไม่ระบุหมวด";
  const NO_SEC = "ไม่ระบุมาตรา";

  const catMap = new Map(); // catLabel -> [{d, idx}]
  list.forEach((d, idx) => {
    const g = (d.tags && d.tags[0]) || NO_CAT;
    if (!catMap.has(g)) catMap.set(g, []);
    catMap.get(g).push({ d, idx });
  });

  const entries = [...catMap.entries()];
  // เรียงหมวดที่ระบุแล้วจากสถิติ (จำนวนฎีกา) มากไปน้อย, หมวด "ไม่ระบุ" ตกไปอยู่ล่างสุดเสมอ
  const specified   = entries.filter(([g]) => g !== NO_CAT).sort((a, b) => b[1].length - a[1].length);
  const unspecified = entries.filter(([g]) => g === NO_CAT);
  const ordered = [...specified, ...unspecified];

  if (ordered.length === 0) return "";

  return ordered.map(([g, items]) => {
    // ยุบซ้อนอีกชั้นตามมาตรา ภายในหมวดเดียวกัน
    const secMap = new Map();
    items.forEach(({ d, idx }) => {
      const secs = getDekaSectionsForItem(d);
      const secKey = secs.length ? secs[0] : NO_SEC;
      if (!secMap.has(secKey)) secMap.set(secKey, []);
      secMap.get(secKey).push({ d, idx });
    });
    const secEntries = [...secMap.entries()];
    const numbered   = secEntries.filter(([s]) => s !== NO_SEC)
      .sort((a, b) => parseFloat(String(a[0]).replace("/", ".")) - parseFloat(String(b[0]).replace("/", ".")));
    const unnumbered = secEntries.filter(([s]) => s === NO_SEC);
    const secOrdered = [...numbered, ...unnumbered];

    return `
      <details class="accordion">
        <summary style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <span>${escHTML(g)}</span>
          <span class="tag tag-purple deka-stat-badge" style="margin:0;">${items.length} </span>
        </summary>
        <div class="accordion-body">
          ${secOrdered.map(([secLabel, secItems]) => `
            <details class="accordion accordion-nested">
              <summary>${secLabel === NO_SEC ? escHTML(NO_SEC) : "ม." + escHTML(secLabel)} <span style="color:var(--text-sub);font-weight:400;">(${secItems.length})</span></summary>
              <div class="accordion-body">
                ${secItems.map(({ d, idx }) => `
                  <button type="button" class="search-result-item" onclick="jumpToDeka(${idx})">
                    <span>${escHTML(d.title)}</span>
                    <span style="color:var(--text-sub);">→</span>
                  </button>`).join("")}
              </div>
            </details>`).join("")}
        </div>
      </details>`;
  }).join("");
}

function buildDekaSearchUI(cat) {
  activateTabUI("deka", route.dekaTab);

  const input = document.getElementById("deka-search-input");
  if (pendingDekaQuery !== null) {
    input.value = pendingDekaQuery;

  }

  if (route.dekaTab === "browse") {

      ? treeHtml
      : `<p class="search-empty">ยังไม่มีฎีกาสำหรับวิชานี้</p>`;
  }
}

let lastFlashResults = [];
let lastDekaResults  = [];

function performSearchFlash(query) {
  const resultsEl = document.getElementById("flash-search-results");
  if (!resultsEl) return;
  const q = (query || "").trim().toLowerCase();
  lastFlashResults = [];
  const cat = DATA.categories[route.catKey];
  if (q.length < 1 || !cat) { resultsEl.innerHTML = ""; return; }

  const results = [];
  (cat.flashCards || []).forEach((card, idx) => {
    const secMatch   = card.section && String(card.section).toLowerCase().includes(q);
    const titleMatch = card.title && String(card.title).toLowerCase().includes(q);
    let elemMatch = false;
    (card.pages || []).forEach(p => {
      if (p.type === "elements" && p.elements) {
        p.elements.forEach(el => {
          if ((el.label && String(el.label).toLowerCase().includes(q)) || (el.detail && String(el.detail).toLowerCase().includes(q))) elemMatch = true;
        });
      }
      if (p.type === "law" && p.content && String(p.content).toLowerCase().includes(q)) elemMatch = true;
    });
    let rawMatch = false;
    try { rawMatch = JSON.stringify(card).toLowerCase().includes(q); } catch (e) {}

    if (secMatch || titleMatch || elemMatch || rawMatch) {
      results.push({ idx, label: `มาตรา ${card.section || "?"} — ${card.title || "ไม่มีชื่อ"}` });
    }
  });

  lastFlashResults = results;
  if (results.length === 0) {
    resultsEl.innerHTML = `<div class="search-empty">ไม่พบผลลัพธ์ที่ตรงกับ "${escHTML(query)}"</div>`;
    return;
  }
  resultsEl.innerHTML = results.map(r => `
    <button type="button" class="search-result-item" onclick="jumpToFlashCard(${r.idx})">
      <span><span class="tag tag-blue" style="margin:0 8px 0 0;">Flash Card</span>${escHTML(r.label)}</span>
      <span style="color:var(--text-sub);">→</span>
    </button>`).join("");
}

function performSearchDeka(query) {
  const resultsEl = document.getElementById("deka-search-results");
  if (!resultsEl) return;
  const q = (query || "").trim().toLowerCase();
  lastDekaResults = [];
  const cat = DATA.categories[route.catKey];
  if (q.length < 1 || !cat) { resultsEl.innerHTML = ""; return; }

  const results = [];
  (cat.dekaList || []).forEach((d, idx) => {
    const titleMatch     = d.title && String(d.title).toLowerCase().includes(q);
    const tagMatch       = d.tags && d.tags.some(t => String(t).toLowerCase().includes(q));
    const principleMatch = d.principle && String(d.principle).toLowerCase().includes(q);
    const statuteMatch   = d.statute && String(d.statute).toLowerCase().includes(q);
    let rawMatch = false;
    try { rawMatch = JSON.stringify(d).toLowerCase().includes(q); } catch (e) {}

    if (titleMatch || tagMatch || principleMatch || statuteMatch || rawMatch) {
      results.push({ idx, label: d.title || "ไม่มีชื่อ" });
    }
  });

  lastDekaResults = results;
  if (results.length === 0) {
    resultsEl.innerHTML = `<div class="search-empty">ไม่พบผลลัพธ์ที่ตรงกับ "${escHTML(query)}"</div>`;
    return;
  }
  resultsEl.innerHTML = results.map(r => `
    <button type="button" class="search-result-item" onclick="jumpToDeka(${r.idx})">
      <span><span class="tag tag-orange" style="margin:0 8px 0 0;">ฎีกา</span>${escHTML(r.label)}</span>
      <span style="color:var(--text-sub);">→</span>
    </button>`).join("");
}

function searchFlashOnEnter(event) {
  if (event.key !== "Enter") return;
  event.preventDefault();
  performSearchFlash(event.target.value);
  if (lastFlashResults.length > 0) jumpToFlashCard(lastFlashResults[0].idx);
}
function searchDekaOnEnter(event) {
  if (event.key !== "Enter") return;
  event.preventDefault();
  performSearchDeka(event.target.value);
  if (lastDekaResults.length > 0) jumpToDeka(lastDekaResults[0].idx);
}

  pendingFlashQuery = term;

function quickSearchDeka(term) {
  pendingDekaQuery = term;

/* ============================================================
   ปุ่มลัด Flash <-> Deka
   ============================================================ */
function extractSectionsFromText(text) {
  const nums = new Set();
  if (!text) return nums;
  const str = String(text);
  [/มาตรา\s*(\d+)/g, /ม\.\s*(\d+)/g].forEach(re => {
    const r = new RegExp(re.source, "g");
    let m;
    while ((m = r.exec(str)) !== null) nums.add(m[1]);
  });
  return nums;
}

function goToRelatedDeka() {
  const cat = DATA.categories[route.catKey];
  if (!cat) return;
  const card = (cat.flashCards || [])[route.cardIdx];
  const section = card ? String(card.section || "").trim() : "";
  if (!section) return;
  quickSearchDeka(section);
}

function goToRelatedCode() {
  const cat = DATA.categories[route.catKey];
  if (!cat) return;
  const d = (cat.dekaList || [])[route.dekaIdx];
  if (!d) return;

  const sections = new Set();
  (d.tags || []).forEach(t => {
    extractSectionsFromText(t).forEach(n => sections.add(n));
    if (/^\d+$/.test(String(t).trim())) sections.add(String(t).trim());
  });
  extractSectionsFromText(d.statute).forEach(n => sections.add(n));
  extractSectionsFromText(d.principle).forEach(n => sections.add(n));
  extractSectionsFromText(d.facts).forEach(n => sections.add(n));
  extractSectionsFromText(d.holding).forEach(n => sections.add(n));

  if (sections.size > 0) {
    quickSearchFlash([...sections][0]);
  } else {
    const term = (d.tags && d.tags[0]) || d.title || "";
    quickSearchFlash(term);
  }
}

   FLASH CARDS
   ============================================================ */
function renderCard(cat) {
  const cards = cat.flashCards || [];
  if (cards.length === 0) {
    document.getElementById("card-content").innerHTML = `<p style="color:var(--text-sub);">ยังไม่มีการ์ดสำหรับวิชานี้</p>`;
    return;
  }
  const idx  = Math.min(Math.max(route.cardIdx, 0), cards.length - 1);
  const card = cards[idx];
  const pageIdx = Math.min(Math.max(route.pageIdx, 0), card.pages.length - 1);
  const total = cards.length;

  document.getElementById("pb").style.width = `${((idx + 1) / total) * 100}%`;

  const dotsEl = document.getElementById("page-dots");
  dotsEl.innerHTML = card.pages.map((_, i) =>
    `<div class="page-dot ${i === pageIdx ? "active" : ""}"></div>`
  ).join("");

  document.getElementById("prevBtn").disabled = idx === 0 && pageIdx === 0;
  document.getElementById("nextBtn").innerText =
    idx === total - 1 && pageIdx === card.pages.length - 1 ? "จบ" : "ถัดไป";

  const page = card.pages[pageIdx];
  const contentEl = document.getElementById("card-content");

  if (page.type === "law") {
    contentEl.innerHTML = `
      <div class="fc-header">
        <div class="fc-section-badge clickable" onclick="event.stopPropagation(); quickSearchFlash('${escJS(card.section)}')" title="ค้นหามาตรานี้">ม.${escHTML(card.section)}</div>
        <div class="fc-title-area">
          <p class="fc-law-name">${escHTML(card.title)}</p>
          <p class="fc-subtitle">${escHTML(card.category || "")} | การ์ด ${idx + 1}/${total}</p>
        </div>
      </div>
      <div class="fc-body">
        <div class="fc-body-text">${nl(page.content)}</div>
      </div>
      <p class="fc-hint"> แตะเพื่อดูองค์ประกอบ</p>`;
  } else if (page.type === "elements") {
    contentEl.innerHTML = `
      <div class="fc-header">
        <div class="fc-section-badge clickable" onclick="event.stopPropagation(); quickSearchFlash('${escJS(card.section)}')" title="ค้นหามาตรานี้">ม.${escHTML(card.section)}</div>
        <div class="fc-title-area">
          <p class="fc-law-name">องค์ประกอบของ ${escHTML(card.title)}</p>
          <p class="fc-subtitle">การ์ด ${idx + 1}/${total}</p>
        </div>
      </div>
      <div class="fc-body">
        <div class="fc-elements">
          ${page.elements.map((el, i) => `
            <div class="fc-elem-row">
              <div class="fc-elem-num">${i + 1}</div>
              <div class="fc-elem-text">
                <span class="fc-elem-label clickable" onclick="event.stopPropagation(); quickSearchFlash('${escJS(el.label)}')" title="ค้นหาคำนี้">${nl(el.label)}</span><br>
                <span style="color:var(--text-sub);font-size:0.85rem;">${nl(el.detail)}</span>
              </div>
            </div>`).join("")}
        </div>
      </div>
      <p class="fc-hint"> แตะเพื่อไปการ์ดถัดไป</p>`;
  }
}

function nextPage() {
  const cat = DATA.categories[route.catKey];
  const card = (cat.flashCards || [])[route.cardIdx];
  if (!card) return;
  if (route.pageIdx < card.pages.length - 1) go({ pageIdx: route.pageIdx + 1 }, { replace: true });
  else nextSection();
}
function nextSection() {
  const cat = DATA.categories[route.catKey];
  const cards = cat.flashCards || [];
  const card = cards[route.cardIdx];
  if (!card) return;
  if (route.pageIdx < card.pages.length - 1) go({ pageIdx: route.pageIdx + 1 }, { replace: true });
  else if (route.cardIdx < cards.length - 1) go({ cardIdx: route.cardIdx + 1, pageIdx: 0 }, { replace: true });
}
function prevSection() {
  if (route.pageIdx > 0) go({ pageIdx: route.pageIdx - 1 }, { replace: true });
  else if (route.cardIdx > 0) go({ cardIdx: route.cardIdx - 1, pageIdx: 0 }, { replace: true });
}
function shuffleCards() {
  const cat = DATA.categories[route.catKey];
  const cards = cat.flashCards || [];
  if (cards.length === 0) return;
  const randomIdx = Math.floor(Math.random() * cards.length);
  go({ cardIdx: randomIdx, pageIdx: 0 }, { replace: true });
}

/* ============================================================
   AI FACT EXTRACTION
   ============================================================ */
async function gptExtractFacts(answer, problem) {
  const prompt = `คุณคือผู้ช่วยอาจารย์นิติศาสตร์ ทำหน้าที่ดึง "ข้อเท็จจริงสำคัญ"
[โจทย์] ${problem}
[คำตอบนักศึกษา] ${answer}
OUTPUT JSON เท่านั้น:
{"problemFacts":[],"answerFacts":[],"matchedFacts":[],"missingFacts":[],"factMatchScore":0.5,"analysis":""}`;
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1000, messages:[{role:"user",content:prompt}] })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const raw  = data.content.map(c=>c.text||"").join("").replace(/```json|```/g,"").trim();
    return JSON.parse(raw);
  } catch {
    return { problemFacts:[], answerFacts:[], matchedFacts:[], missingFacts:[], factMatchScore:0.5, analysis:"ไม่สามารถเรียก AI ได้" };
  }
}

/* ============================================================
   SCORING ENGINE
   ============================================================ */
function tokenize(text) {
  const t = text.toLowerCase().replace(/[^\u0E00-\u0E7Fa-z0-9\s]/g," ").trim();
  const words = t.split(/\s+/).filter(w=>w.length>=2);
  const bigrams = [];
  for(const w of words) for(let j=0;j<w.length-1;j++) bigrams.push(w[j]+w[j+1]);
  return [...words,...bigrams];
}
function similarity(a,b) {
  if(!a||!b) return 0;
  const ta=new Set(tokenize(a)), tb=new Set(tokenize(b));
  if(ta.size===0||tb.size===0) return 0;
  let inter=0; ta.forEach(t=>{if(tb.has(t))inter++;});
  return inter/(ta.size+tb.size-inter);
}
function extractSectionNumbers(text) {
  const nums=new Set();
  [/มาตรา\s*(\d+)/g,/ม\.\s*(\d+)/g].forEach(re=>{
    const r=new RegExp(re.source,"g"); let m;
    while((m=r.exec(text))!==null) nums.add(m[1]);
  });
  return nums;
}
function extractVerdictFromModel(mc) {
  return QCE_CONFIG.conclusion.verdictWords.filter(v=>mc.includes(v));
}
function splitZones(text) {
  const lines=text.split(/\n/).map(l=>l.trim()).filter(l=>l.length>0);
  const BOUNDARIES=[
    {zone:"issue",order:1,patterns:[/ประเด็น/,/มีประเด็นต้องพิจารณา/,/issue/i]},
    {zone:"rule", order:2,patterns:[/หลักกฎหมาย/,/ป\.พ\.พ\.\s*มาตรา/,/มาตรา\s*\d+.*วางหลักว่า/,/ตาม ป\.พ\.พ\./,/มาตรา\s*\d+/,/rule\b/i]},
    {zone:"app",  order:3,patterns:[/ข้อเท็จจริงตามปัญหา/,/ตามข้อเท็จจริง/,/ปรับใช้/,/วินิจฉัย/,/application\b/i,/กรณีตามปัญหา/,/เมื่อพิจารณา/]},
    {zone:"con",  order:4,patterns:[/ด้วยเหตุผลดังที่วินิจฉัย/,/สรุป/,/โดยสรุป/,/ดังนั้น/,/conclusion/i]}
  ];
  function detectZone(line,curOrd) {
    for(const b of BOUNDARIES) if(b.order>=curOrd&&b.patterns.some(re=>re.test(line))) return b;
    return null;
  }
  const zones={issue:[],rule:[],app:[],con:[]};
  let curZone="issue",curOrd=1;
  for(const line of lines) {
    const d=detectZone(line,curOrd);
    if(d&&!(d.zone==="con"&&curZone==="app"&&line.length>60)){curZone=d.zone;curOrd=d.order;}
    zones[curZone].push(line);
  }
  if(zones.app.length===0&&zones.con.length===0&&lines.length>=3)
    return {issueText:lines[0]||"",ruleText:lines[1]||"",appText:lines.slice(2,lines.length-1).join("\n")||"",conText:lines[lines.length-1]||"",fullText:text};
  return {issueText:zones.issue.join("\n"),ruleText:zones.rule.join("\n"),appText:zones.app.join("\n"),conText:zones.con.join("\n"),fullText:text};
}

async function scoreTextWithModel(text, problem, modelAnswer) {
  const Z=splitZones(text), cfg=QCE_CONFIG;
  const hasAny=(src,arr)=>arr.some(k=>src.toLowerCase().includes(k.toLowerCase()));
  let teacherAdvice=[], teacherMistakes=[];

  const ci=cfg.issue;
  const issueSrc=Z.issueText.length>5?Z.issueText:Z.fullText.substring(0,Math.ceil(Z.fullText.length*0.20));
  const hasTrig=hasAny(issueSrc,ci.triggerPhrases)||issueSrc.includes("หรือไม่");
  const issueSim=similarity(issueSrc,modelAnswer.issue);
  let iScore=ci.scoreNone;
  if(hasTrig){ if(issueSim>=ci.thFull)iScore=ci.scoreFull; else if(issueSim>=ci.thHalf||issueSrc.length>10){iScore=ci.scoreHalf;teacherAdvice.push("ควรตั้งประเด็นให้กระชับและตรงคำถามมากกว่านี้");} }
  else teacherMistakes.push("ไม่พบการตั้งประเด็น หรือไม่มี Keyword บังคับ");
  const iFB=iScore===ci.scoreFull?cfg.feedback.issue.full:iScore>0?cfg.feedback.issue.half:cfg.feedback.issue.none;

  const cr=cfg.rule;
  const modelSecs=extractSectionNumbers(modelAnswer.rule), userSecs=extractSectionNumbers(Z.fullText);
  const matchSecs=[...modelSecs].filter(n=>userSecs.has(n));
  const hasCorrectSec=matchSecs.length>0;
  const ruleSrc=Z.ruleText.length>15?Z.ruleText:Z.fullText;
  const ruleSimModel=similarity(ruleSrc,modelAnswer.rule);
  const hasSubstance=ruleSrc.length>25&&(hasAny(ruleSrc,cr.substancePhrases)||ruleSimModel>=cr.thContent);
  let rScore=cr.scoreNone;
  if(hasCorrectSec){ if(hasSubstance)rScore=(matchSecs.length===modelSecs.size)?cr.scoreFull:cr.scoreHalf+1; else{rScore=cr.scoreHalf;teacherMistakes.push("อ้างเพียงเลขมาตรา แต่ไม่อธิบายเนื้อหาตัวบท");teacherAdvice.push("ต้องอธิบายองค์ประกอบตัวบทหลังเลขมาตราเสมอ");} }
  else teacherMistakes.push("อ้างอิงเลขมาตราไม่ถูกต้อง หรือไม่พบมาตราที่ตรงกับเฉลย");
  const rFB=rScore===cr.scoreFull?cfg.feedback.rule.full:rScore>0?cfg.feedback.rule.half:cfg.feedback.rule.none;
  const ruleDebug={modelSecs:[...modelSecs].join(",")||"-",userSecs:[...userSecs].join(",")||"-",simModel:ruleSimModel.toFixed(3),hasSubstance};

  const ca=cfg.application;
  const hasHedge=hasAny(Z.appText.length>10?Z.appText:Z.fullText,ca.hedgePhrases);
  const appHasZone=Z.appText.trim().length>=30;
  const appSrc=appHasZone?Z.appText:"";
  let aScore=ca.scoreNone, aFB=cfg.feedback.application.none, appDebug;
  if(hasHedge){
    aScore=ca.scoreNone; aFB=cfg.feedback.application.hedge;
    teacherMistakes.push("พบคำลังเล (น่าจะ/อาจจะ) ในพาร์ทวินิจฉัย — ตัดเป็น 0 คะแนนทันที");
    appDebug={sim:0,factMatch:"0.000",hedgeFound:true,hasZone:appHasZone};
  } else if(!appHasZone||appSrc.length===0){
    teacherMistakes.push("ไม่พบส่วน Application หรือสั้นเกินไป");
    appDebug={sim:"0.000",simEff:"0.000",factMatch:"0.000",hasZone:false};
  } else {
    const appSim=similarity(appSrc,modelAnswer.application);
    const factAI=await gptExtractFacts(appSrc,problem);
    const factMatchRatio=factAI.factMatchScore, hasFactMatch=factMatchRatio>=0.35;
    if(appSim>=ca.thFull&&hasFactMatch){aScore=ca.scoreFull;aFB=cfg.feedback.application.full;}
    else if(appSim>=ca.thFull||appSim>=ca.thPartial){
      aScore=ca.scorePartial;aFB=cfg.feedback.application.partial;
      if(!hasFactMatch){teacherMistakes.push(`ขาด fact สำคัญ: ${factAI.missingFacts.slice(0,2).join(", ")}`);teacherAdvice.push(`[AI]: ${factAI.analysis}`);}
    } else if(appSim>=ca.thMin&&hasFactMatch){aScore=ca.scoreMin;aFB=cfg.feedback.application.min;}
    else{aScore=ca.scoreNone;aFB=cfg.feedback.application.none;}
    appDebug={sim:appSim.toFixed(3),simEff:appSim.toFixed(3),factMatch:factMatchRatio.toFixed(3),hasZone:true};
  }

  const cc=cfg.conclusion;
  const modelVerds=extractVerdictFromModel(modelAnswer.conclusion);
  const conHasZone=Z.conText.trim().length>3, conSrc=conHasZone?Z.conText:"";
  let cScore=cc.scoreNone, conSim=0, verdictHit=false;
  if(conHasZone&&conSrc.length>0){
    conSim=similarity(conSrc,modelAnswer.conclusion);
    verdictHit=hasAny(conSrc,cc.verdictWords)||modelVerds.some(v=>conSrc.includes(v));
    if(verdictHit&&conSim>=cc.thFull)cScore=cc.scoreFull;
    else if(verdictHit||conSim>=cc.thHalf){cScore=cc.scoreHalf;teacherAdvice.push("สรุปตอนท้ายควรฟันธงให้ชัดเจนเด็ดขาด");}
    else{cScore=cc.scoreNone;teacherMistakes.push("สรุปผลฟันธงไม่ตรงตามหลักคำตอบ");}
  } else teacherMistakes.push("ไม่เขียนย่อหน้าสรุปผล (Conclusion) ท้ายคำตอบ");
  const cFB=cScore===cc.scoreFull?cfg.feedback.conclusion.full:cScore>0?cfg.feedback.conclusion.half:cfg.feedback.conclusion.none;

  const totalScore=iScore+rScore+aScore+cScore, maxTotal=ci.maxPoints+cr.maxPoints+ca.maxPoints+cc.maxPoints;
  const pct=Math.round((totalScore/maxTotal)*100);
  let finalGrade=cfg.grades[cfg.grades.length-1];
  for(const g of cfg.grades){if(pct>=g.min){finalGrade=g;break;}}
  if(teacherMistakes.length===0) teacherMistakes.push("ไม่พบข้อผิดพลาดร้ายแรง เขียนได้ดีมาก");
  if(teacherAdvice.length===0) teacherAdvice.push("รักษามาตรฐานการเขียนแบบนี้ไว้เพื่อเตรียมสอบสนามจริง");

  return {
    totalScore, maxTotal, pct, grade:finalGrade,
    teacherReview:{mistakes:teacherMistakes.slice(0,3), advice:teacherAdvice.join(" ")},
    breakdown:{
      issue:{score:iScore,max:ci.maxPoints,fb:iFB},
      rule:{score:rScore,max:cr.maxPoints,fb:rFB,debug:ruleDebug},
      application:{score:aScore,max:ca.maxPoints,fb:aFB,debug:appDebug},
      conclusion:{score:cScore,max:cc.maxPoints,fb:cFB,debug:{sim:conSim.toFixed(3),hit:verdictHit}}
    }
  };
}

      <div style="margin-top:14px;font-size:0.75rem;color:var(--text-sub);background:var(--bg);padding:8px;border-radius:6px;">
        💡 <b>เกณฑ์:</b> ${QCE_CONFIG.criteriaHint}
      </div>
    </div>`;
}

window.addEventListener("DOMContentLoaded", loadData);
</script>
