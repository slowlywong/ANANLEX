  function sizeGraphCanvas() {
  if (!G.cv || !G.wrap) return false;
  const w = G.wrap.clientWidth, h = G.wrap.clientHeight;
  if (!w || !h) return false;
  const dpr = window.devicePixelRatio || 1;
  if (w === G.w && h === G.h && dpr === G.dpr) return false;
  G.w = w; G.h = h; G.dpr = dpr;
  G.cv.width = Math.round(w * dpr);
  G.cv.height = Math.round(h * dpr);
  G.cv.style.width = w + "px";
  G.cv.style.height = h + "px";
  return true;
}

let _gResizeT = null;
function onGraphResize() {
  if (route.screen !== "screen-graph" || !G.cv) return;
  clearTimeout(_gResizeT);
  // หน่วงเล็กน้อย เพราะ iOS รายงานขนาดจอหลังหมุนช้ากว่า event

    if (!sizeGraphCanvas()) return;

    if (G.tf) {

    }

}

/* ===== GRAPH CTA ===== */
.graph-cta{
  position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;
  width:100%;margin-bottom:20px;padding:18px 20px;cursor:pointer;text-align:left;
  font-family:inherit;color:#fff;border-radius:20px;
  border:1px solid rgba(129,140,248,.35);
  background:radial-gradient(120% 140% at 0% 0%,#312e81 0%,#0f172a 62%);
  box-shadow:0 10px 30px rgba(79,70,229,.28),inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .2s,box-shadow .2s,filter .2s,border-color .2s;
}
@media (hover:hover){
  .graph-cta:hover{transform:translateY(-2px);border-color:#a5b4fc;
    box-shadow:0 14px 38px rgba(99,102,241,.45),inset 0 1px 0 rgba(255,255,255,.12);}
  .graph-cta:hover .gc-go{transform:translateX(4px);}
  .graph-cta:hover .gc-net{opacity:.9;}
}
.graph-cta:active{transform:scale(.98);filter:brightness(1.25);}
.gc-net{position:absolute;right:0;top:0;height:100%;width:62%;opacity:.55;pointer-events:none;transition:opacity .25s;}
.gc-net line{stroke:#818cf8;stroke-width:1;opacity:.65;}
.gc-net circle{fill:#a5b4fc;}
.gc-net .hot{fill:#fbbf24;transform-box:fill-box;transform-origin:center;animation:gcPulse 2.4s ease-in-out infinite;}
@keyframes gcPulse{50%{transform:scale(1.7);opacity:.55;}}
.gc-orb{position:relative;z-index:1;flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;
  color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);
  box-shadow:0 0 0 6px rgba(129,140,248,.14);}
.gc-text{position:relative;z-index:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
.gc-text b{font-family:'Inter','Sarabun',sans-serif;font-size:1.12rem;letter-spacing:-.01em;}
.gc-text small{color:#c7d2fe;font-size:.8rem;line-height:1.4;}
.gc-text em{font-style:normal;font-size:.72rem;font-weight:700;color:#fbbf24;margin-top:3px;letter-spacing:.03em;}
.gc-go{position:relative;z-index:1;margin-left:auto;flex:none;width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;background:rgba(255,255,255,.12);transition:transform .2s;}
@media (max-width:520px){ .gc-net{width:45%;opacity:.35;} .gc-text small{font-size:.74rem;} }

      /* ===== UI POLISH LAYER ===== */
:root{
  --bg:#f5f7fb; --card-bg:#fff; --primary:#3b4cca; --secondary:#16a34a;
  --accent:#f59e0b; --danger:#dc2626; --text-main:#1e2433; --text-sub:#6b7280;
  --radius:18px; --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
  --shadow-hover:0 2px 4px rgba(16,24,40,.06),0 14px 32px rgba(16,24,40,.12);
  --line:#e5e8f0;
}
[data-theme="dark"]{
  --bg:#0d1117; --card-bg:#161b26; --primary:#7c8cff; --secondary:#22c55e;
  --danger:#f87171; --line:#262d3d; --disabled:#262d3d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-hover:0 14px 32px rgba(0,0,0,.5);
}
body{
  --card:var(--card-bg); --bd:var(--line); --mut:var(--text-sub); --fg:var(--text-main);
  --ac:var(--primary); --ok:var(--secondary); --bad:var(--danger);
}
html{-webkit-text-size-adjust:100%;}
body{font-family:'Sarabun','Noto Sans Thai',sans-serif;font-size:16px;line-height:1.6;padding:0 16px 96px;}
.container{max-width:640px;}
button{-webkit-tap-highlight-color:transparent;}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:2px;}

/* header ติดขอบบน */
.header{position:sticky;top:0;z-index:100;margin:0 -16px 20px;padding:12px 16px;
  background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);}
.header h1{font-size:1.15rem;letter-spacing:-.01em;}
.header-actions{display:flex;gap:6px;}
.icon-btn{min-width:40px;height:40px;padding:0 10px;border-radius:12px;border:1px solid var(--line);
  background:var(--card-bg);color:var(--text-main);font:inherit;font-weight:700;cursor:pointer;transition:.15s;}
.icon-btn:hover{border-color:var(--primary);}

/* ปุ่มย้อนกลับเป็น pill */
.back-nav{padding:8px 14px;margin-bottom:16px;border-radius:999px;background:var(--card-bg);
  border:1px solid var(--line);font-size:.9rem;transition:.15s;}
.back-nav:hover{border-color:var(--primary);}

/* การ์ด/ปุ่มเมนู */
.content-block,.deka-card{border:1px solid var(--line);}
.main-btn{border:1px solid var(--line);min-height:76px;padding:18px 20px;
  transition:transform .18s,box-shadow .18s,border-color .18s;}
.main-btn:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--primary);}
.main-btn:active{transform:scale(.98);}
.main-btn h3{font-size:1rem;}
.icon-box{width:48px;height:48px;background:color-mix(in srgb,var(--primary) 10%,var(--card-bg));}

/* ปุ่มทั่วไป */
.btn{min-height:46px;transition:transform .15s,filter .15s;}
.btn:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px);}
.btn:active:not(:disabled){transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 65%,#8b5cf6));}

/* แท็บ/ค้นหา/แท็ก */
.tab-row{background:var(--bg);padding:4px;border-radius:14px;}
.tab-btn{border:none;background:transparent;border-radius:10px;min-height:42px;transition:.15s;}
.tab-btn.active{background:var(--card-bg);box-shadow:var(--shadow);color:var(--primary);}
.search-box{border-radius:14px;min-height:46px;}
.tag{border-radius:999px;padding:3px 12px;}
.progress-container{height:8px;}
.progress-bar{background:linear-gradient(90deg,var(--primary),var(--secondary));}
.flashcard{border:1px solid var(--line);}
.fab{bottom:20px;right:16px;box-shadow:var(--shadow-hover);}

/* แถบความคืบหน้าบนหน้าแรก */
.mini-bar{height:5px;border-radius:99px;background:var(--line);margin-top:8px;overflow:hidden;}
.mini-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--secondary));border-radius:99px;}

/* เคารพผู้ที่ปิดแอนิเมชัน */
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

<script>
/* ============================================================================
   graph-layout.js — Dual-mode Knowledge Graph Layout (Global ⇄ Focus/Fermat)
   ใช้ร่วมกับ D3 v7 + Canvas (ต่อกับตัวแปร G / drawGraph ของ ANANLEX ได้ทันที)

   ส่วนที่ 1  Pure JS: Fermat's Spiral
   ส่วนที่ 2  Force ของ Global View (cluster attract + inter-cluster repel)
   ส่วนที่ 3  LayoutController: state machine + smooth transition + dynamic scaling
   ส่วนที่ 4  วิธีเสียบเข้ากับ filter/zoom/click/draw เดิม
   ส่วนที่ 5  Data Schema ตัวอย่าง (Node / Edge)
   ========================================================================== */

/* ───────────────────────── 1) FERMAT'S SPIRAL (Pure JS) ───────────────────────── */

const GOLDEN_ANGLE_DEG = 137.507764;
const GOLDEN_ANGLE_RAD = GOLDEN_ANGLE_DEG * Math.PI / 180;   // ≈ 2.39996

/**
 * จุดที่ n บน Fermat's Spiral:  r = c·√n ,  θ = n·137.507764°
 * @param {number} n       ลำดับ (เริ่มที่ 1 เพื่อไม่ให้โหนดแรกทับศูนย์กลาง = Main Node)
 * @param {number} c       ค่าคงที่สเกล (px)
 * @param {number} rot     มุมหมุนเริ่มต้น (rad) ใช้ทำให้แต่ละ Main Node ไม่เรียงเหมือนกัน
 * @returns {{x:number,y:number,r:number,theta:number}}  พิกัดสัมพัทธ์จากศูนย์กลาง
 */
function fermatPoint(n, c = 14, rot = 0) {
  const r = c * Math.sqrt(n);
  const theta = n * GOLDEN_ANGLE_RAD + rot;
  return { x: r * Math.cos(theta), y: r * Math.sin(theta), r, theta };
}

/**
 * คำนวณ c อัตโนมัติ ให้ระยะห่างเพื่อนบ้านใกล้สุด ≈ minGap
 * (พื้นที่ต่อจุด = π·c²  →  ระยะห่างโดยประมาณ ≈ c·√π ≈ 1.77c)
 */
function fermatAutoC(minGap = 26) {
  return minGap / Math.sqrt(Math.PI);
}

/**
 * สร้างพิกัดของ count จุดรอบ (cx, cy)
 * @returns {Array<{x,y,r,theta,n}>}  (n เริ่มที่ 1)
 */
function fermatLayout(count, { c = fermatAutoC(), cx = 0, cy = 0, rot = 0 } = {}) {
  const out = new Array(count);
  for (let i = 0; i < count; i++) {
    const p = fermatPoint(i + 1, c, rot);
    out[i] = { x: cx + p.x, y: cy + p.y, r: p.r, theta: p.theta, n: i + 1 };
  }
  return out;
}

/* ───────────────────────── helpers ───────────────────────── */

const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = d3.easeCubicInOut;
const easeBack = d3.easeBackOut.overshoot(1.3);   // เด้งเกินเป้าเล็กน้อยแล้วนิ่ง

/* ───────────────────────── 2) GLOBAL VIEW FORCES ───────────────────────── */

/**
 * วางศูนย์กลางของแต่ละกลุ่ม (catKey) บนวงกลมใหญ่ แล้วดึงสมาชิกเข้าหาศูนย์กลางตัวเอง
 * = แรงดึงดูดภายในกลุ่ม
 */
function makeClusterCenters(catKeys, radius = 260) {
  const centers = new Map();
  catKeys.forEach((k, i) => {
    const a = (i / catKeys.length) * Math.PI * 2 - Math.PI / 2;
    centers.set(k, { x: Math.cos(a) * radius, y: Math.sin(a) * radius });
  });
  return centers;
}

function forceClusterAttract(centers, strength = 0.09) {
  let nodes;
  const f = alpha => {
    for (const n of nodes) {
      const c = centers.get(n.cat);
      if (!c) continue;
      n.vx += (c.x - n.x) * strength * alpha;
      n.vy += (c.y - n.y) * strength * alpha;
    }
  };
  f.initialize = ns => (nodes = ns);
  return f;
}

/**
 * แรงผลักระหว่างกลุ่ม: ใช้ centroid ของแต่ละกลุ่ม ผลักสมาชิกออกจาก centroid กลุ่มอื่น
 * ที่อยู่ใกล้กว่า minDist  (O(N·K) ไม่ใช่ O(N²))
 */
function forceClusterRepel(strength = 0.6, minDist = 320) {
  let nodes;
  const f = alpha => {
    const cs = new Map();                                  // cat → {x,y,n}
    for (const n of nodes) {
      const c = cs.get(n.cat) || cs.set(n.cat, { x: 0, y: 0, n: 0 }).get(n.cat);
      c.x += n.x; c.y += n.y; c.n++;
    }
    cs.forEach(c => { c.x /= c.n; c.y /= c.n; });
    for (const n of nodes) {
      for (const [cat, c] of cs) {
        if (cat === n.cat) continue;
        const dx = n.x - c.x, dy = n.y - c.y;
        const d = Math.hypot(dx, dy) || 1;
        if (d < minDist) {
          const k = ((minDist - d) / minDist) * strength * alpha;
          n.vx += (dx / d) * k * 10;
          n.vy += (dy / d) * k * 10;
        }
      }
    }
  };
  f.initialize = ns => (nodes = ns);
  return f;
}

/** สร้าง simulation ของ Global View */
function buildGlobalSimulation(nodes, links, catKeys, onTick) {
  const centers = makeClusterCenters(catKeys);
  const sameCat = l => l.source.cat === l.target.cat;
  return d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id)
      .distance(l => sameCat(l) ? 24 + 3.2 * Math.sqrt(Math.max(l.source.deg, l.target.deg)) : 220)       // ลิงก์ข้ามกลุ่มยาว+อ่อน
      .strength(l => sameCat(l) ? 0.45 : 0.02))
    .force("charge", d3.forceManyBody().strength(d => d.type === "section" ? -70 - 4 * Math.sqrt(d.deg) : -30).distanceMax(260))
    .force("cluster", forceClusterAttract(centers))
    .force("repel", forceClusterRepel())
    .force("collide", d3.forceCollide(d => d.r + 1))
    .on("tick", onTick);
}

/* ───────────────────────── 3) LAYOUT CONTROLLER ─────────────────────────
   State machine:
        ┌────────── zoom ≥ ENTER_K  หรือ  คลิก Main Node ──────────┐
        ▼                                                          │
     GLOBAL  ───────────────────────────────────────────────►   FOCUS(node)
        ▲                                                          │
        └────────── zoom < EXIT_K (hysteresis)  หรือ กดพื้นที่ว่าง ──┘

   - Transition ใช้ค่า t ∈ [0,1] ตัวเดียว (tween ด้วย d3.timer) แล้ว
     ตำแหน่งลูก = lerp(ตำแหน่งตอนเริ่ม, เป้าหมายบนเกลียว, easeInOut(stagger(t, n)))
   - ทิศขาออก: ปล่อย fx/fy คืนให้ force simulation แล้ว alpha restart เบา ๆ
   ------------------------------------------------------------------------- */

const LAYOUT = {
  ENTER_K: 1.5,          // เข้า Focus เมื่อซูม >= 1.5
  EXIT_K: 1.3,           // ออกเมื่อซูม < 1.3 (hysteresis กันกระพริบ)
  DURATION: 800,         // ms
  STAGGER: 0.55,         // 0..1 ความหน่วงของลูกลำดับท้าย ๆ
  MIN_GAP: 30,           // px ระยะห่างขั้นต่ำบนเกลียว
  MIN_SCALE: 0.55,       // ขนาดต่ำสุดของลูกที่ไกลสุด
  FAR_ALPHA: 0.6,        // alpha สุดท้ายของลูกที่ไกลสุด
  DIM_OTHERS: 0.1,       // alpha ของโหนดที่ไม่เกี่ยวข้องตอน Focus
  MAX_CHILDREN: 90,      // แสดงลูกบนเกลียวสูงสุดกี่โหนด (เรียงตามความสำคัญ)
  BOOST: 1.8,            // ขยายขนาดลูกตอน Focus ให้มองเห็นชัด
  SWIRL: 2.4,            // rad: ลูกหมุนคลี่ออกจากแขนเกลียวตอนเข้า Focus
  CLEAR_PAD: 40, MAX_GATES: 12, GATE_PAD: 60,          // px: เว้นระยะรอบเกลียวให้โหนดอื่นถูกผลักออก
};

class LayoutController {
  /**
   * @param {object} ctx
   *   getNodes():  โหนดทั้งหมดที่กำลังแสดง
   *   getAdj():    Map<id, Set<id>>
   *   byId:        Map<id, node>
   *   sim():       d3 simulation ปัจจุบัน
   *   redraw():    () => void
   *   screenCenterToWorld(): [x,y]  (จุดกลางจอในพิกัดโลก)
   */
  constructor(ctx) {
    this.ctx = ctx;
    this.mode = "global";        // 'global' | 'focus'
    this.focus = null;           // main node
    this.children = [];          // เรียงตาม n
    this.childSet = new Set();
    this.fitK = 1;               // ระดับซูมที่เห็นเกลียวครบ
    this.exitK = LAYOUT.EXIT_K;
    this.t = 0;                  // 0 = global, 1 = focus เต็ม
    this.timer = null;
    this.manualFocus = false;    // true = ผู้ใช้คลิกเอง → ไม่ auto-exit ด้วยซูม
    this._debounce = null;
  }

  /* ---------- เลือกลูกของ Main Node + จัดลำดับ n ---------- */
  _collectChildren(main) {
    const { getAdj, byId } = this.ctx;
    const kids = [...(getAdj().get(main.id) || [])]
      .map(id => byId.get(id))
      .filter(n => n && (n.type === "deka" || n.type === "tag"));
    // ลำดับ n: ฎีกาก่อน แล้วแท็ก; ในกลุ่มเดียวกันเรียงตาม degree มาก→น้อย (สำคัญสุดอยู่ใกล้ศูนย์กลาง)
    const rank = n => (n.type === "deka" ? 0 : 1);
    kids.sort((a, b) => rank(a) - rank(b) || b.deg - a.deg);
    this.totalKids = kids.length;
    return kids.slice(0, LAYOUT.MAX_CHILDREN);
  }

  /* ---------- เข้าสู่ Focus Mode ---------- */
  /* ประตู = มาตราต่างวิชาที่เชื่อมกับ main ทั้งตรงและผ่านฎีกาที่อ้างร่วมกัน */
  _collectGates(main) {
    const { getAdj, byId } = this.ctx, adj = getAdj(), w = new Map();
    const bump = (s, k) => {
      if (!s || s === main || s.type !== "section" || s.cat === main.cat) return;
      w.set(s, (w.get(s) || 0) + k);
    };
    for (const id of adj.get(main.id) || []) {
      const a = byId.get(id); if (!a) continue;
      if (a.type === "section") bump(a, 0);
      else if (a.type === "deka")
        for (const id2 of adj.get(a.id) || []) bump(byId.get(id2), 1);
    }
    return [...w].sort((p, q) => q[1] - p[1] || q[0].deg - p[0].deg)
      .slice(0, LAYOUT.MAX_GATES).map(([n, k]) => { n._gw = Math.max(1, k); return n; });
  }

  enterFocus(main, { manual = false } = {}) {
    if (!main || main.type !== "section") return;
    if (this.mode === "focus" && this.focus === main) return;

    if (this.mode === "focus") this._release(true);       // สลับ main ตรง ๆ: ปล่อยของเก่าทันที

    this.mode = "focus";
    this.focus = main;
    this.manualFocus = manual;
    this.children = this._collectChildren(main);
    this.childSet = new Set(this.children);

    // pin main node ไว้กับที่ และ snapshot ตำแหน่งเริ่มต้นของลูก
    main.fx = main.x; main.fy = main.y;
    const c = fermatAutoC(LAYOUT.MIN_GAP);
    const rot = (hash01(main.id) * Math.PI * 2);          // หมุนไม่เหมือนกันในแต่ละ Main Node
    const pts = fermatLayout(this.children.length, { c, cx: main.x, cy: main.y, rot });
    this.children.forEach((n, i) => {
      n._sx = n.x; n._sy = n.y;                           // start
      n._tx = pts[i].x; n._ty = pts[i].y;                 // target
      n._n = i + 1; n._tth = pts[i].theta;                                       // ลำดับบนเกลียว
      n._rn = pts[i].r;                                   // รัศมีจริง
      n._baseR = n._baseR ?? n.r;
    });
    const spMax = pts.length ? pts[pts.length - 1].r : 1;
    this.children.forEach(n => { n._gate = false; });
    const gates = this._collectGates(main);
    const ringR = gates.length ? spMax + LAYOUT.GATE_PAD : 0;
    const ga = gates.map(g => ({ g, a: Math.atan2((g.y ?? main.y) - main.y, (g.x ?? main.x) - main.x) }))
                    .sort((p, q) => p.a - q.a);
    const gap = Math.min(0.5, 6.283 / (ga.length + 1));
    for (let it = 0; it < 20; it++) for (let i = 0; i < ga.length; i++) {
      const j = (i + 1) % ga.length; if (j === i) continue;
      let d = ga[j].a - ga[i].a; if (j === 0) d += 6.283;
      if (d < gap) { const s = (gap - d) / 2; ga[i].a -= s; ga[j].a += s; }
    }
    ga.forEach(o => {
      const g = o.g; g._gate = true; g._sx = g.x; g._sy = g.y;
      g._n = 1; g._tth = o.a; g._rn = ringR; g._baseR = g._baseR ?? g.r;
    });
    this.gates = gates; this.nSpiral = this.children.length;
    this.children = this.children.concat(gates); this.childSet = new Set(this.children);
    this.maxR = Math.max(spMax, ringR);
    const [vw, vh] = this.ctx.getViewSize ? this.ctx.getViewSize() : [600, 400];
    this.fitK = Math.max(0.6, Math.min(3, (Math.min(vw, vh) / 2 * 0.85) / (this.maxR + 24)));
    // คลิกเอง: ยอมให้ซูมต่ำกว่า 1.3 ได้ถ้าเกลียวใหญ่ (ไม่งั้นเด้งออกทันที)
    this.exitK = manual ? Math.min(LAYOUT.EXIT_K, this.fitK * 0.7) : LAYOUT.EXIT_K;

    // แรง "เคลียร์พื้นที่": ผลักโหนดอื่นออกนอกวงเกลียว (ไม่ให้ ม.อื่นนั่งทับเกลียว)
    const simF = this.ctx.sim();
    if (simF) {
      const R = this.maxR + LAYOUT.CLEAR_PAD, kids = this.childSet;
      let all = [];
      const clear = () => {
        for (const n of all) {
          if (n === main || kids.has(n)) continue;
          const dx = n.x - main.x, dy = n.y - main.y, d = Math.hypot(dx, dy) || 1;
          if (d < R) { const k = (R - d) * 0.25; n.vx += dx / d * k; n.vy += dy / d * k; }
        }
      };
      clear.initialize = ns => (all = ns);
      simF.force("focusClear", clear);
      simF.alpha(Math.max(simF.alpha(), 0.4)).restart();
    }

    this._tween(1);
  }

  /* ---------- ออกจาก Focus Mode ---------- */
  exitFocus() {
    if (this.mode !== "focus") return;
    this.mode = "global";
    this._tween(0, () => this._release(false));
  }

  _release(immediate) {
    const main = this.focus;
    const simR = this.ctx.sim();
    if (simR) simR.force("focusClear", null);
    if (main) { main.fx = null; main.fy = null; }
    this.children.forEach(n => {
      n.fx = null; n.fy = null;
      n.sc = 1; n.alpha = 1; n._gate = false;
      if (n._baseR != null) n.r = n._baseR;
    });
    this.children = []; this.childSet = new Set(); this.focus = null; this.t = 0; this.gates = []; this.nSpiral = 0;
    if (this.timer) { this.timer.stop(); this.timer = null; }
    const sim = this.ctx.sim();
    if (sim && !immediate) sim.alpha(0.25).restart();     // ให้ Global ค่อย ๆ จัดตัวใหม่
  }

  /* ---------- tween ค่า t ไปยัง target (0|1) ---------- */
  _tween(target, done) {
    if (this.timer) this.timer.stop();
    const from = this.t, span = Math.abs(target - from) || 1;
    const dur = LAYOUT.DURATION * span;
    const t0 = performance.now();
    this.timer = d3.timer(() => {
      const p = clamp01((performance.now() - t0) / dur);
      this.t = lerp(from, target, p);
      this._apply();
      this.ctx.redraw();
      if (p >= 1) {
        this.timer.stop(); this.timer = null;
        this.t = target;
        if (done) done();
      }
    });
  }

  /* ---------- นำ t ไปคำนวณตำแหน่ง / ขนาด / alpha ของลูกทุกตัว ---------- */
  _apply() {
    const N = this.children.length || 1;
    const S = LAYOUT.STAGGER;
    this.children.forEach(n => {
      // stagger: ลูกลำดับต้น ๆ เริ่มก่อน ลำดับท้ายเริ่มทีหลัง แต่ทุกตัวจบเมื่อ t = 1
      const delay = ((n._n - 1) / N) * S;
      const lt = clamp01((this.t - delay) / (1 - S));
      const local = easeInOut(lt);

      // unfurl: เส้นทางโค้งแบบสปริง — หมุนคลี่ออก + เด้งเกินเป้าเล็กน้อยแล้วนิ่งที่จุดเกลียว
      const ang = n._tth - (1 - local) * LAYOUT.SWIRL;
      const wx = this.focus.x + Math.cos(ang) * n._rn;
      const wy = this.focus.y + Math.sin(ang) * n._rn;
      const wgt = easeBack(lt);
      n.fx = n.x = lerp(n._sx, wx, wgt);
      n.fy = n.y = lerp(n._sy, wy, wgt);
      if (n._gate) { n.sc = lerp(1, 1.5, local); n.r = n._baseR * n.sc; n.alpha = local; return; }

      // Dynamic scaling: ยิ่งไกลศูนย์กลาง (r มาก) ยิ่งเล็กลงเล็กน้อย
      const far = Math.sqrt(n._n / N);                    // 0..1 สัมพันธ์กับรัศมี (r ∝ √n)
      const finalScale = lerp(1, LAYOUT.MIN_SCALE, far) * LAYOUT.BOOST;
      n.sc = lerp(1, finalScale, local);
      n.r = n._baseR * n.sc;

      // Fade-in ตามลำดับ n: เริ่ม 0 → ค่าปลายทางซึ่งจางลงตามระยะ
      const finalAlpha = lerp(1, LAYOUT.FAR_ALPHA, far);
      n.alpha = local * finalAlpha;
    });
  }

  /* ---------- เรียกทุกครั้งที่ซูมเปลี่ยน ---------- */
  onZoom(k) {
    clearTimeout(this._debounce);
    this._debounce = setTimeout(() => {
      if (k >= LAYOUT.ENTER_K && this.mode === "global") {
        const [wx, wy] = this.ctx.screenCenterToWorld();
        const main = this._nearestMain(wx, wy);
        if (main) this.enterFocus(main, { manual: false });
      } else if (k >= LAYOUT.ENTER_K && this.mode === "focus" && !this.manualFocus) {
        // ซูมค้างแล้วเลื่อนจอไป Main Node อื่น → สลับโฟกัส
        const [wx, wy] = this.ctx.screenCenterToWorld();
        const main = this._nearestMain(wx, wy);
        if (main && main !== this.focus) this.enterFocus(main, { manual: false });
      } else if (k < this.exitK && this.mode === "focus") {
        this.exitFocus();                                  // ซูมออกเสมอ = กลับ Global
      }
    }, 120);
  }

  _nearestMain(wx, wy) {
    let best = null, bd = Infinity;
    for (const n of this.ctx.getNodes()) {
      if (n.type !== "section" || n.x == null) continue;
      const d = (n.x - wx) ** 2 + (n.y - wy) ** 2;
      if (d < bd) { bd = d; best = n; }
    }
    return best;
  }

  /* ---------- ใช้ตอน draw: ค่า alpha ของโหนดใดโหนดหนึ่ง ---------- */
  alphaOf(n) {
    if (this.mode === "global" && this.t === 0) return null;      // ไม่แทรกแซง
    if (n === this.focus) return 1;
    if (this.children.includes(n)) return n.alpha ?? 1;
    return lerp(1, LAYOUT.DIM_OTHERS, easeInOut(this.t));         // โหนดอื่นจางลง
  }
}

/** hash string → 0..1 (ใช้เป็นมุมหมุนเริ่มต้นแบบคงที่ต่อโหนด) */
function hash01(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 10000) / 10000;
}


/** กันลาก Main Node / ลูกที่ถูก pin ไว้ระหว่าง Focus Mode */
function dragLocked(s) {
  return !!(G.layout && G.layout.mode === "focus" && s && (s === G.layout.focus || G.layout.children.includes(s)));
}

function nl(text) {
  if (!text) return "";
  return String(text).replace(/\\n/g, "\n").replace(/\n/g, "<br>");
}
function escJS(str) {
  return String(str == null ? "" : str).replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/\n/g, " ");
}
function escHTML(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ============================================================

const QCE_CONFIG = {

/* ============================================================
   DATA (โหลดจาก data.json ที่ผู้ใช้มีอยู่แล้ว)
   ============================================================ */
let DATA = {};let GRAPH = null;

/* ===== GRAPH: Parsing helpers ===== */
const THAI_DIGITS = '๐๑๒๓๔๕๖๗๘๙';
const toArabic = s => s.replace(/[๐-๙]/g, d => THAI_DIGITS.indexOf(d));

// ดึงเลขมาตราจากข้อความ รองรับ 224/1, 277 ทวิ, 340 ตรี, "ม.204 วรรคสอง"
function extractSections(text) {
  if (!text) return [];
  const t = toArabic(String(text));
  const out = new Set();
  const re = /(?:มาตรา|ม\.)\s*(\d+(?:\/\d+)?(?:\s*(?:ทวิ|ตรี|จัตวา))?)/g;
  let m;
  while ((m = re.exec(t))) out.add(m[1].replace(/\s+/g, ' ').trim());
  const list = /(?:มาตรา|ม\.)\s*((?:\d+(?:\/\d+)?\s*(?:,|และ)\s*)+\d+(?:\/\d+)?)/g;
  while ((m = list.exec(t))) m[1].split(/,|และ/).forEach(x => out.add(x.trim()));
  return [...out];
}

// แยกประมวลกฎหมาย กัน ม.94 ป.วิ.พ. ชนกับ ม.94 ป.พ.พ.
function detectCode(statuteText, catKey) {
  const s = statuteText || '';
  if (/ป\.?\s?วิ\.?\s?พ|วิธีพิจารณาความแพ่ง/.test(s)) return 'CPC';
  if (/ป\.?\s?วิ\.?\s?อ|วิธีพิจารณาความอาญา/.test(s)) return 'CRPC';
  if (/ป\.?\s?อ\.|กฎหมายอาญา/.test(s)) return 'CRIM';
  if (/ป\.?\s?พ\.?\s?พ|แพ่งและพาณิชย์/.test(s)) return 'CCC';
  return catKey === 'criminal_offenses' ? 'CRIM' : 'CCC';
}

const isSectionTag = t => /^(?:ม\.|มาตรา)\s*\d/.test(toArabic(t));
const shortDeka = t => {
  const s = String(t || "");
  const m = toArabic(s).match(/ฎีกา(?:ที่)?\s*(\d+\/\d+)/);
  if (m) return `ฎีกา ${m[1]}`;
  const h = s.replace(/\s*[—–-].*$/, '').replace(/^คำพิพากษาศาลฎีกาที่/, 'ฎีกา').trim();
  return h.length > 18 ? h.slice(0, 17) + "…" : h;
};

/* ===== GRAPH: Main ===== */
function buildGraph(data) {
  const nodes = [], links = [], idx = new Map();
  const linkSet = new Set();

  const add = (id, type, label, ref = {}) => {
    if (!idx.has(id)) {
      const n = { id, type, label, ref, deg: 0 };
      idx.set(id, n); nodes.push(n);
    }
    return idx.get(id);
  };
  const link = (a, b, kind) => {
    if (!a || !b || a.id === b.id) return;
    const key = a.id < b.id ? `${a.id}|${b.id}|${kind}` : `${b.id}|${a.id}|${kind}`;
    if (linkSet.has(key)) return;
    linkSet.add(key);
    a.deg++; b.deg++;
    links.push({ source: a.id, target: b.id, kind });
  };
  const sectionNode = (code, sec) => idx.get(`s:${code}:${sec}`);

  // 1) มาตรา
  for (const [catKey, cat] of Object.entries(data.categories)) {
    (cat.flashCards || []).forEach((c, i) => {
      const code = catKey === 'criminal_offenses' ? 'CRIM' : 'CCC';
      const sec = toArabic(String(c.section)).trim();
      const n = add(`s:${code}:${sec}`, 'section', `ม.${sec}`, { catKey, cardIdx: i });
      n.title = c.title;
      n.group = c.chapter || c.category;
      (n.refs ||= []).push({ catKey, cardIdx: i });
    });
  }

  // 2) ฎีกา + ลิงก์
  for (const [catKey, cat] of Object.entries(data.categories)) {
    (cat.dekaList || []).forEach((d, i) => {
      const dn = add(`d:${catKey}:${i}`, 'deka', shortDeka(d.title || ''), { catKey, dekaIdx: i });
      dn.full = d.title;

      const code = detectCode(d.statute, catKey);
      const secs = new Set();
      extractSections(d.statute).forEach(s => secs.add(s));
      (d.tags || []).filter(isSectionTag).forEach(t => extractSections(t).forEach(s => secs.add(s)));
      extractSections(d.holding).forEach(s => secs.add(s));

      secs.forEach(s => {
        const sn = sectionNode(code, s);
        if (sn) link(dn, sn, 'cites');
        else (dn.orphans ||= []).push(`${code}:${s}`);
      });

      (d.tags || []).filter(t => !isSectionTag(t)).forEach(t => {
        const tn = add(`t:${catKey}:${t}`, 'tag', t, { catKey });
        link(dn, tn, 'tagged');
      });
    });
  }

  // 3) มาตรา ↔ มาตรา (co-cited)
  const byDeka = new Map();
  links.filter(l => l.kind === 'cites').forEach(l => {
    (byDeka.get(l.source) || byDeka.set(l.source, []).get(l.source)).push(l.target);
  });
  byDeka.forEach(secs => {
    if (secs.length > 1 && secs.length <= 4)
      for (let a = 0; a < secs.length; a++)
        for (let b = a + 1; b < secs.length; b++)
          link(idx.get(secs[a]), idx.get(secs[b]), 'cocited');
  });

  return { nodes, links, idx };
}

function auditOrphans(graph) {
  return graph.nodes.filter(n => n.type === 'deka' && !graph.links.some(
    l => (l.source === n.id || l.target === n.id) && l.kind === 'cites'
  ));
}

/* ===== BACKLINKS PANEL ===== */
function neighborsOf(id, kind) {
  if (!GRAPH) return [];
  return GRAPH.links
    .filter(l => l.kind === kind && (l.source === id || l.target === id))
    .map(l => GRAPH.idx.get(l.source === id ? l.target : l.source))
    .filter(Boolean);
}
/* ===== GRAPH VIEW (Obsidian-style) ===== */
let G = { sim:null, nodes:[], links:[], adj:new Map(), byId:new Map(), tf:null,
          hover:null, sel:null, ctx:null, cv:null, w:0, h:0, dpr:1, bound:false, zoom:null };
const GRAPH_COLORS = ['#6366f1','#22c55e','#f59e0b','#ef4444','#06b6d4','#a855f7','#ec4899','#84cc16'];
const catColor = k => GRAPH_COLORS[Math.max(0, Object.keys(DATA.categories).indexOf(k)) % GRAPH_COLORS.length];

const GSTATE_KEY = "ananlex_graph_v1";
function loadGraphState() { try { return JSON.parse(localStorage.getItem(GSTATE_KEY) || "null"); } catch (e) { return null; } }
function saveGraphState() {
  if (!G.nodes.length) return;
  const L = G.layout;
  try {
    const old = loadGraphState() || {}, pos = old.pos || {};
    if (!(L && (L.mode === "focus" || L.t > 0)))          // ไม่เก็บตำแหน่งตอนโหนดอยู่บนเกลียว
      G.nodes.forEach(n => { if (n.x != null) pos[n.id] = [Math.round(n.x), Math.round(n.y)]; });
    const tf = G.tf ? { x: G.tf.x, y: G.tf.y, k: G.tf.k } : old.tf;
    localStorage.setItem(GSTATE_KEY, JSON.stringify({ v: 1, pos, tf }));
  } catch (e) {}
}
let _gSaveT = null;
function saveGraphSoon() { clearTimeout(_gSaveT); _gSaveT = setTimeout(saveGraphState, 600); }
window.addEventListener("pagehide", saveGraphState);

function openGraph() { go({ screen: "screen-graph", gSel: null, gHi: null }); }

function initGraph() {
  const info = document.getElementById("graph-info");
  if (!GRAPH || typeof d3 === "undefined") {
    info.innerHTML = `<p class="search-empty">โหลดกราฟไม่สำเร็จ (GRAPH หรือ d3 ไม่พร้อม) ดู Console</p>`;
    return;
  }
    const wrap = document.getElementById("graph-wrap"), cv = document.getElementById("graph-canvas");
  G.cv = cv; G.wrap = wrap;
  G.ctx = cv.getContext("2d");
  sizeGraphCanvas();
  if (!G.bound) { bindGraphEvents(); G.bound = true; }
  if (!G.tf) {
    const s = loadGraphState();
    G.tf = (s && s.tf) ? d3.zoomIdentity.translate(s.tf.x, s.tf.y).scale(s.tf.k)
                       : d3.zoomIdentity.translate(G.w / 2, G.h / 2);
  }
  G.quiet = true;                      // กันซูมที่ restore ไปกระตุ้น auto-focus
  d3.select(cv).call(G.zoom.transform, G.tf);
  G.quiet = false;
  graphRefilter();
}

function graphRefilter() {
  if (!GRAPH || typeof d3 === "undefined") return;
  const on = id => document.getElementById(id).checked;
  const showD = on("g-deka"), showC = on("g-co"), showI = on("g-iso");

  const keepIds = new Set(GRAPH.nodes
    .filter(n => n.type === "section" || (n.type === "deka" && showD))
    .map(n => n.id));
  const ls = GRAPH.links.filter(l => keepIds.has(l.source) && keepIds.has(l.target) && (showC || l.kind !== "cocited"));

  const deg = new Map();
  ls.forEach(l => {
    deg.set(l.source, (deg.get(l.source) || 0) + 1);
    deg.set(l.target, (deg.get(l.target) || 0) + 1);
  });

  // มาตราที่เชื่อมหลายวิชา = มีการ์ดหลายหมวด หรือถูกฎีกาจากหมวดอื่นอ้าง
  const cats = new Map();
  GRAPH.nodes.forEach(n => { if (n.type === "section") cats.set(n.id, new Set((n.refs || []).map(r => r.catKey))); });
  GRAPH.links.forEach(l => {
    if (l.kind !== "cites") return;
    const d = GRAPH.idx.get(l.source), s = GRAPH.idx.get(l.target);
    if (d && s && cats.has(s.id)) cats.get(s.id).add(d.ref.catKey);
  });

  const nodes = GRAPH.nodes
    .filter(n => keepIds.has(n.id) && (showI || (deg.get(n.id) || 0) > 0))
    .map((n, i) => {
      const d = deg.get(n.id) || 0, c = cats.get(n.id);
      return {
        id: n.id, type: n.type, label: n.label, title: n.title, full: n.full,
        ref: n.ref, refs: n.refs, deg: d, i,
        cat: (n.ref && n.ref.catKey) || "_", sc: 1, alpha: 1,
        bridge: !!c && c.size > 1,
        tags: n.type === "deka"
          ? new Set(((((DATA.categories[n.ref.catKey] || {}).dekaList) || [])[n.ref.dekaIdx] || {}).tags || [])
          : null,
        color: n.type === "tag" ? "#94a3b8" : catColor(n.ref && n.ref.catKey),
        r: n.type === "section" ? 3 + Math.sqrt(d) * 1.6 : n.type === "deka" ? 2.2 : 2.5 + Math.sqrt(d)
      };
    });

  const ids = new Set(nodes.map(n => n.id));
  const links = ls.filter(l => ids.has(l.source) && ids.has(l.target))
                  .map(l => ({ source: l.source, target: l.target, kind: l.kind }));

  G.adj = new Map();
  links.forEach(l => {
    (G.adj.get(l.source) || G.adj.set(l.source, new Set()).get(l.source)).add(l.target);
    (G.adj.get(l.target) || G.adj.set(l.target, new Set()).get(l.target)).add(l.source);
  });
  G.byId = new Map(nodes.map(n => [n.id, n]));
  G.nodes = nodes; G.links = links; G.sel = null; G.hover = null;
  G.byDeg = [...nodes].sort((a, b) => b.deg - a.deg);
  nodes.forEach(n => { if (n.tags) n.tags = new Set([...n.tags].filter(t => !isSectionTag(String(t)))); });

  const saved = (loadGraphState() || {}).pos || {};
  const centers = makeClusterCenters(Object.keys(DATA.categories));
  let hit = 0;
  nodes.forEach(n => {
    const p = saved[n.id];
    if (p) { n.x = p[0]; n.y = p[1]; hit++; }
    else {                                                     // โหนดใหม่เริ่มใกล้คลัสเตอร์ตัวเอง
      const c = centers.get(n.cat) || { x: 0, y: 0 };
      n.x = c.x + (Math.random() - .5) * 60; n.y = c.y + (Math.random() - .5) * 60;
    }
  });

  if (G.layout) { clearTimeout(G.layout._debounce); G.layout._release(true); }
  if (G.sim) G.sim.stop();
  G.sim = buildGlobalSimulation(nodes, links, Object.keys(DATA.categories), drawGraph);
  G.sim.on("end", saveGraphState);
  G.sim.alpha(hit === nodes.length ? 0.02 : hit > nodes.length * 0.8 ? 0.15 : 1);
  G.layout = new LayoutController({
    getNodes: () => G.nodes,
    getAdj: () => G.adj,
    byId: G.byId,
    sim: () => G.sim,
    redraw: drawGraph,
    screenCenterToWorld: () => G.tf.invert([G.w / 2, G.h / 2]),
    getViewSize: () => [G.w, G.h],
  });

  G.tagFilter = null; G.hi = null; G.pulse = null; G.trail = G.trail || [];
  const want = route.gSel;
  selectNode(null, { keep: true, quiet: true });
  if (want && !G.byId.has(want) && !on("g-iso")) {            // มาตราไร้ลิงก์ ต้องเปิดตัวกรองก่อน
    document.getElementById("g-iso").checked = true; return graphRefilter();
  }
  const wn = want && G.byId.get(want);
  if (wn) selectNode(wn, { keep: true, hi: (route.gHi && G.byId.get(route.gHi)) || null });
}

function nodeAt(px, py) {
  if (!G.tf) return null;
  const [x, y] = G.tf.invert([px, py]);
  let best = null, bd = Infinity;
  for (const n of G.nodes) {
    if (n.x == null) continue;
    const dx = n.x - x, dy = n.y - y, d = dx * dx + dy * dy, rr = n.r + 4;
    if (d < rr * rr && d < bd) { best = n; bd = d; }
  }
  return best;
}

function bindGraphEvents() {
  const cv = G.cv, sel = d3.select(cv);
  G.zoom = d3.zoom().scaleExtent([0.15, 8])
    .filter(e => e.type === "wheel" || (!e.button && !nodeAt(...d3.pointer(e, cv))))
    .on("zoom", e => { G.tf = e.transform; if (G.layout && !G.quiet) G.layout.onZoom(G.tf.k); drawGraph(); saveGraphSoon(); });
  sel.call(G.zoom);

  sel.call(d3.drag().container(cv)
    .subject(e => nodeAt(e.x, e.y))
    .on("start", e => { if (dragLocked(e.subject)) return; if (!e.active) G.sim.alphaTarget(0.3).restart(); e.subject.fx = e.subject.x; e.subject.fy = e.subject.y; })
    .on("drag", e => { if (dragLocked(e.subject)) return; const [x, y] = G.tf.invert([e.x, e.y]); e.subject.fx = x; e.subject.fy = y; })
    .on("end", e => { if (dragLocked(e.subject)) return; if (!e.active) G.sim.alphaTarget(0); e.subject.fx = null; e.subject.fy = null; }));

  cv.addEventListener("mousemove", ev => {
    const r = cv.getBoundingClientRect();
    const n = nodeAt(ev.clientX - r.left, ev.clientY - r.top);
    if (n !== G.hover) { G.hover = n; cv.style.cursor = n ? "pointer" : "grab"; drawGraph(); }
  });
  cv.addEventListener("click", ev => {
    const r = cv.getBoundingClientRect();
    selectNode(nodeAt(ev.clientX - r.left, ev.clientY - r.top));
  });
}

function drawGraph() {
  const { ctx, w, h, dpr, tf } = G;
  if (!ctx || !tf) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.translate(tf.x, tf.y); ctx.scale(tf.k, tf.k);

  const dark = document.body.dataset.theme === "dark";
  const focus = G.sel || G.hover, nb = focus ? G.adj.get(focus.id) : null;
  const L = G.layout;
  const near = n => !focus || n === focus || (nb && nb.has(n.id)) || (L && L.mode === "focus" && L.childSet.has(n));

  ctx.lineWidth = 1 / tf.k;
  for (const l of G.links) {
    const a = l.source, b = l.target;
    if (a.x == null || b.x == null) continue;
    const act = focus && (a === focus || b === focus);
    let la0 = focus ? (act ? 0.9 : 0.06) : 0.3;
    if (L) { const aa = L.alphaOf(a), ab = L.alphaOf(b); if (aa != null && ab != null) la0 *= Math.min(aa, ab); }
    if (L && L.mode === "focus" && L.focus &&
        !((a === L.focus || L.childSet.has(a)) && (b === L.focus || L.childSet.has(b)))) la0 *= 0.25;
    ctx.globalAlpha = la0;
    ctx.strokeStyle = act ? "#f59e0b" : (dark ? "#94a3b8" : "#64748b");
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  if (L && L.mode === "focus" && L.focus) for (const g of L.gates || []) {   // เส้นประตู หนาตามจำนวนฎีการ่วม
    if (g.x == null) continue;
    ctx.globalAlpha = 0.55 * (g.alpha ?? 1);
    ctx.strokeStyle = g.color; ctx.lineWidth = (1 + Math.min(g._gw || 1, 6) * 1.2) / tf.k;
    ctx.beginPath(); ctx.moveTo(L.focus.x, L.focus.y); ctx.lineTo(g.x, g.y); ctx.stroke();
  }
  ctx.lineWidth = 1 / tf.k;
  for (const n of G.nodes) {
    if (n.x == null) continue;
    const lay = L ? L.alphaOf(n) : null;
    let a = lay != null ? Math.min(lay, near(n) ? 1 : 0.12) : (near(n) ? 1 : 0.12);
    const tm = G.tagFilter && n.type === "deka" && n.tags ? n.tags.has(G.tagFilter) : null;
    if (tm === false) a *= 0.15;
    ctx.globalAlpha = a;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 6.2832);
    ctx.fillStyle = n.color; ctx.fill();
    if (n.bridge || n === G.sel || n === G.hi || tm) {
      ctx.lineWidth = 2 / tf.k;
      ctx.strokeStyle = n === G.sel ? (dark ? "#fff" : "#000") : (n === G.hi || tm) ? "#f59e0b" : "#fbbf24";
      ctx.stroke();
    }
  }
  if (G.pulse) {                                       // วงแหวนกะพริบบอก "ตรงนี้"
    const t = (performance.now() - G.pulse.t0) / 1600, pn = G.pulse.n;
    if (t >= 1 || pn.x == null) G.pulse = null;
    else {
      ctx.globalAlpha = Math.abs(Math.sin(t * Math.PI * 3)) * (1 - t);
      ctx.strokeStyle = "#f59e0b"; ctx.lineWidth = 3 / tf.k;
      ctx.beginPath(); ctx.arc(pn.x, pn.y, pn.r + (6 + 34 * t) / tf.k, 0, 6.2832); ctx.stroke();
      if (!G._raf) G._raf = requestAnimationFrame(() => { G._raf = 0; drawGraph(); });
    }
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = dark ? "#e5e7eb" : "#1e2433";
  ctx.font = `${11 / tf.k}px Sarabun, sans-serif`;
  const inFocus = !!(L && L.mode === "focus" && L.focus);
  const boxes = [];
  const tryLabel = n => {
    if (!n || n.x == null || !n.label) return false;
    const sx = n.x * tf.k + tf.x + (n.r + 2) * tf.k, sy = n.y * tf.k + tf.y;
    if (sx < -20 || sx > w || sy < -10 || sy > h + 10) return false;          // นอกจอไม่วาด
    const base = n._gate ? n.label + " · " + ((DATA.categories[n.cat] || {}).label || "") : n.label;
    const lim = n._gate ? 28 : 18;
    const txt = base.length > lim ? base.slice(0, lim - 1) + "…" : base;
    const bw = txt.length * 6.6 + 6;
    for (const bx of boxes) if (sx < bx.x + bx.w && sx + bw > bx.x && Math.abs(sy - bx.y) < 12) return false;
    boxes.push({ x: sx, y: sy, w: bw });
    const v = L ? L.alphaOf(n) : null;
    ctx.globalAlpha = v == null ? 1 : v;
    ctx.fillText(txt, n.x + n.r + 2, n.y + 3 / tf.k);
    return true;
  };
  tryLabel(focus);
  if (inFocus) {
    tryLabel(L.focus); tryLabel(G.hover); tryLabel(G.sel);
    for (const g of L.gates || []) tryLabel(g);
    tryLabel(G.hi);
    const cap = Math.min(60, Math.floor(6 * tf.k * tf.k));      // ซูมมาก → ป้ายเยอะขึ้น (LOD)
    let cnt = 0;
    for (const n of L.children) { if (cnt >= cap) break; if (n.type === "deka" && tryLabel(n)) cnt++; }
  } else if (focus) {
    const cap = Math.min(40, Math.floor(5 * tf.k * tf.k) + 3);
    const list = (nb ? [...nb] : []).map(id => G.byId.get(id)).filter(Boolean).sort((p, q) => q.deg - p.deg);
    let cnt = 0;
    for (const n of list) { if (cnt >= cap) break; if (tryLabel(n)) cnt++; }
  } else {
    let cnt = 0;
    for (const n of (G.byDeg || G.nodes)) {
      if (cnt >= 60) break;
      if (((n.type === "section" && (tf.k > 1.3 || n.deg >= 8)) || tf.k > 2.5) && tryLabel(n)) cnt++;
    }
  }
  drawOverlay(dark);
}

/** ชั้นหน้าจอ: tooltip ชื่อเต็มเมื่อ hover + สถานะ Focus */
function drawOverlay(dark) {
  const { ctx, tf, dpr, w, h } = G, L = G.layout;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalAlpha = 1;
  ctx.font = "12px Sarabun, sans-serif";
  if (L && L.mode === "focus" && L.focus) {
    ctx.fillStyle = dark ? "#94a3b8" : "#64748b";
    ctx.fillText(`Focus ${L.focus.label} · ฎีกา ${L.nSpiral} จาก ${L.totalKids} · ประตู ${(L.gates || []).length}${G.tagFilter ? " · แท็ก: " + G.tagFilter : ""}`, 12, h - 12);
  }
  const n = G.hover;
  if (n && n.x != null) {
    const full = n.type === "deka" ? (n.full || n.label) : (n.label + (n.title ? " — " + n.title : ""));
    const t = full.length > 90 ? full.slice(0, 89) + "…" : full;
    const sx = n.x * tf.k + tf.x, sy = n.y * tf.k + tf.y;
    const tw = ctx.measureText(t).width + 16;
    const bx = Math.min(Math.max(8, sx + 12), w - tw - 8), by = Math.max(8, sy - 34);
    ctx.fillStyle = dark ? "rgba(15,23,42,.94)" : "rgba(255,255,255,.96)";
    ctx.strokeStyle = dark ? "#334155" : "#cbd5e1";
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx, by, tw, 24, 8); else ctx.rect(bx, by, tw, 24);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = dark ? "#f1f5f9" : "#1e2433";
    ctx.fillText(t, bx + 8, by + 16);
  }
}

function legendHTML() {
  const cats = Object.entries(DATA.categories)
    .map(([k, c]) => `<span><i style="background:${catColor(k)}"></i>${escHTML(c.label)}</span>`).join("");
  return `<div class="g-legend">
    <span><b>${G.nodes.length}</b> โหนด · <b>${G.links.length}</b> เส้น</span>${cats}
    <span><i style="background:transparent;border:2px solid #fbbf24;"></i>มาตราที่เชื่อมข้ามวิชา</span>
  </div>
  <p class="search-empty">แตะโหนดเพื่อดูรายละเอียด · ลากโหนดเพื่อจัดวาง · ซูมด้วยล้อเมาส์หรือสองนิ้ว</p>`;
}

function selectNode(n, o = {}) {
  G.trail = G.trail || [];
  const prev = G.sel;
  G.sel = n; G.hi = o.hi || null; G.tagFilter = null;
  if (!prev && n) G.trail = [];
  if (n && prev && prev !== n && !o.noPush) { G.trail.push(prev.id); if (G.trail.length > 30) G.trail.shift(); }
  if (!o.keep) {                                    // จำสถานะใน history entry นี้ → กด Back แล้วกลับมาที่เดิม
    route.gSel = n ? n.id : null; route.gHi = G.hi ? G.hi.id : null;
    persistRoute(); try { history.replaceState(route, ""); } catch (e) {}
  }
  const L = G.layout;
  if (L) {
    if (n && n.type === "section") { L.enterFocus(n, { manual: true }); centerOn(n); }
    else if (!n) {
      L.manualFocus = false; L.exitFocus();
      if (prev && prev.type === "section" && !o.quiet) {      // ออกจาก Focus: กล้องกลับไปที่โหนด + วงแหวนกะพริบ
        G.pulse = { n: prev, t0: performance.now() };
        centerOn(prev, Math.max(0.8, Math.min(G.tf.k, 1.2)));
      }
    }
  }
  drawGraph();
  renderInfo(n);
}

function renderInfo(n) {
  const el = document.getElementById("graph-info");
  if (!n) { el.innerHTML = legendHTML(); return; }
  const typeLabel = { section: "มาตรา", deka: "ฎีกา" }[n.type] || "";
  const nbs = [...(G.adj.get(n.id) || [])].map(id => G.byId.get(id)).filter(Boolean);
  const btn = "padding:8px 14px;margin:4px 6px 0 0;";
  let open = "";
  if (n.type === "section") {
    open = (n.refs || []).map(r => `<button class="btn btn-primary" style="${btn}"
      onclick="jumpToCardIn('${escJS(r.catKey)}',${r.cardIdx})">เปิด Flash Card (${escHTML((DATA.categories[r.catKey] || {}).label || r.catKey)})</button>`).join("");
  } else if (n.type === "deka") {
    open = `<button class="btn btn-primary" style="${btn}" onclick="jumpToDekaIn('${escJS(n.ref.catKey)}',${n.ref.dekaIdx})">เปิดฎีกา</button>`;
  }
  const back = G.trail.length ? `<button class="btn btn-secondary" style="${btn}" onclick="graphBack()">← ย้อนกลับ</button>` : "";

  let chips = "";                                    // แท็ก = ตัวกรอง ไม่ใช่โหนด
  if (n.type === "section") {
    const cnt = new Map();
    nbs.filter(m => m.type === "deka").forEach(m => (m.tags || new Set()).forEach(t => cnt.set(t, (cnt.get(t) || 0) + 1)));
    G.tagList = [...cnt].sort((a, b) => b[1] - a[1]).slice(0, 14).map(x => x[0]);
    chips = G.tagList.length
      ? `<div class="deka-section-label">กรองฎีกาตามแท็ก</div>` + G.tagList.map((t, i) =>
          `<button type="button" class="ov-section-btn" id="gtag-${i}" onclick="graphTag(${i})">${escHTML(t)} <small>${cnt.get(t)}</small></button>`).join("")
      : "";
  }
  const gates = (G.layout && G.layout.focus === n) ? (G.layout.gates || []) : [];
  const gateHtml = gates.length
    ? `<div class="deka-section-label">ประตูสู่วิชาอื่น (${gates.length})</div>` + gates.map(g =>
        `<button type="button" class="ov-section-btn" style="border-color:${g.color}" onclick="graphSelectIdx(${g.i})">${escHTML(g.label)} · ${escHTML((DATA.categories[g.cat] || {}).label || "")} <small>×${g._gw}</small></button>`).join("")
    : "";
  const title = n.type === "deka" ? (n.full || n.label) : n.label + (n.title ? " — " + n.title : "");

  el.innerHTML = `<div style="margin-top:12px;">
    <span class="tag tag-blue">${typeLabel}</span>
    <div style="font-weight:700;">${escHTML(title)}</div>
    ${n.bridge ? `<div style="font-size:.82rem;color:#b45309;margin-top:4px;">🌉 เชื่อมหลายวิชา</div>` : ""}
    <div>${back}${open}</div>
    ${gateHtml}${chips}
    <div class="deka-section-label">เชื่อมกับ (${nbs.length})</div>
    ${nbs.slice(0, 40).map(m => `<button type="button" class="ov-section-btn" onclick="graphSelectIdx(${m.i})">${escHTML(m.label)}</button>`).join("")}
    ${nbs.length > 40 ? `<span class="search-empty"> …และอีก ${nbs.length - 40}</span>` : ""}
  </div>`;
}

function graphTag(i) {
  const t = G.tagList[i];
  G.tagFilter = G.tagFilter === t ? null : t;
  document.querySelectorAll('[id^="gtag-"]').forEach(b => { b.style.background = ""; b.style.color = ""; });
  if (G.tagFilter) { const b = document.getElementById("gtag-" + i); if (b) { b.style.background = "var(--primary)"; b.style.color = "#fff"; } }
  drawGraph();
}
function graphBack() {
  const id = G.trail.pop(), n = id && G.byId.get(id);
  if (n) selectNode(n, { noPush: true });
}

function graphSelectIdx(i) { const n = G.nodes[i]; if (n) { selectNode(n); centerOn(n); } }

function centerOn(n, kk) {
  const L = G.layout;
  const k = kk || ((L && L.mode === "focus" && L.focus === n) ? L.fitK : Math.max(G.tf.k, 1.5));
  d3.select(G.cv).transition().duration(600)
    .call(G.zoom.transform, d3.zoomIdentity.translate(G.w / 2 - n.x * k, G.h / 2 - n.y * k).scale(k));
}

function graphSearch(q) {
  q = toArabic((q || "").trim()).toLowerCase();
  if (!q || !G.nodes.length) return;
  const hit = G.nodes.find(n => n.type === "section" && n.label.toLowerCase() === "ม." + q)
    || G.nodes.find(n => ((n.label || "") + " " + (n.title || "") + " " + (n.full || "")).toLowerCase().includes(q));
  if (hit) { selectNode(hit); centerOn(hit); }
}

        }).join("")}` : ""}

}

   ============================================================ */
const ROUTE_KEY = "slb_route_v1";

const DEFAULT_ROUTE = {
  screen: "screen-category",
  catKey: null,
  cardIdx: 0,
  pageIdx: 0,
  dekaIdx: 0,
  writingIdx: 0,
  flashTab: "keyword",
  dekaTab: "keyword",
  gSel: null,
  gHi: null,
};

let route = { ...DEFAULT_ROUTE };
let currentFontSize = 1.0;

let pendingFlashQuery = null;
let pendingDekaQuery = null;

function loadRouteFromStorage() {
  try {
    const raw = sessionStorage.getItem(ROUTE_KEY);
    if (raw) return { ...DEFAULT_ROUTE, ...JSON.parse(raw) };
  } catch (e) {}
  return { ...DEFAULT_ROUTE };
}

function persistRoute() {
  try { sessionStorage.setItem(ROUTE_KEY, JSON.stringify(route)); } catch (e) {}
}

function go(partial, opts) {
  if (route.screen === "screen-graph") saveGraphState();
  opts = opts || {};
  route = { ...route, ...partial };
  persistRoute();
  if (opts.replace) {
    window.history.replaceState(route, "");
  } else {
    window.history.pushState(route, "");
    navDepth++;
  }
  render();
}

window.addEventListener("popstate", function (e) {
  if (route.screen === "screen-graph") saveGraphState();
  if (navDepth > 0) navDepth--;
  route = e.state ? { ...DEFAULT_ROUTE, ...e.state } : loadRouteFromStorage();
  persistRoute();
  render();
});

async function loadData() {
  try {
    const res = await fetch("data.json");
    if (!res.ok) throw new Error(`HTTP ${res.status} — ไม่พบไฟล์`);
    const json = await res.json();
    DATA = json;
    if (!DATA.categories) DATA.categories = {};
    if (!DATA.groups) DATA.groups = {};
        try {
      GRAPH = buildGraph(DATA);
      console.log("GRAPH:", GRAPH.nodes.length, "nodes,", GRAPH.links.length, "links");
      console.log("ฎีกาไม่มีลิงก์:", auditOrphans(GRAPH).length);
    } catch (e) { console.warn("buildGraph failed", e); }

    route = window.history.state && window.history.state.screen
      ? { ...DEFAULT_ROUTE, ...window.history.state }
      : loadRouteFromStorage();

    if (route.catKey && !DATA.categories[route.catKey]) {
      route = { ...DEFAULT_ROUTE };
    }

    window.history.replaceState(route, "");
    document.getElementById("loading-overlay").style.display = "none";
    document.getElementById("app").style.display = "block";
    render();
  } catch (err) {
    document.getElementById("loading-overlay").innerHTML = `
      <div class="load-error">❌ โหลด data.json ไม่สำเร็จ<br>
      <code>${escHTML(err.message)}</code>
      ตรวจสอบว่า <b>data.json</b> อยู่ในโฟลเดอร์เดียวกับ HTML<br>
      และเปิดผ่าน <b>Live Server</b> (Go Live) ใน VS Code</div>
      <button class="retry-btn" onclick="location.reload()">🔄 ลองใหม่</button>`;
  }
}

    background:var(--bd);color:var(--mut);}
  .dq-opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);}

  .dq-opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);}
  .dq-opt.bad .dq-key{background:var(--bad);color:#fff;}
  .dq-opt.dim{opacity:.55;}
  .dq-fb{margin-top:16px;padding:14px 16px;border-radius:14px;line-height:1.7;animation:dqIn .25s ease;
    background:color-mix(in srgb,var(--c) 10%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);}
  .dq-fb b{color:var(--c);}
  .dq-foot{position:fixed;left:0;right:0;bottom:0;padding:14px 16px;background:linear-gradient(transparent,var(--bg) 40%);}
  .dq-next{display:block;width:100%;max-width:700px;margin:0 auto;padding:15px;border:none;border-radius:16px;font:inherit;font-weight:700;
    font-size:1rem;color:#fff;background:linear-gradient(135deg,#6366f1,#8b5cf6);cursor:pointer;box-shadow:0 8px 20px #6366f155;}
  .dq-btn{padding:12px 18px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;font-weight:600;cursor:pointer;}
  .dq-btn.p{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;}
  .dq-btn.d{color:var(--bad);}
  .dq-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
  .dq-big{text-align:center;padding:24px 0;}
  .dq-ring{width:130px;height:130px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:2rem;font-weight:800;
    background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--bd) 0);position:relative;}
  .dq-ring::before{content:"";position:absolute;inset:10px;background:var(--bg);border-radius:50%;}
  .dq-ring span{position:relative;}
  .dq-li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd);}
  .dq-li small{color:var(--mut);}
  .dq-pill{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;}
  .dq-pill.r{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);}
  .dq-pill.w{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad);}
  `;
  document.head.appendChild(st);
}

function dqOverlay(html){
  dqInjectCSS();
  let ov = document.getElementById("dq-ov");
  if (!ov) { ov = document.createElement("div"); ov.id = "dq-ov"; document.body.appendChild(ov); }
  ov.dataset.theme = document.body.dataset.theme === "dark" ? "dark" : "light";
  ov.innerHTML = html;
}
function dqClose(){ const ov = document.getElementById("dq-ov"); if (ov) ov.remove(); }

/* แถบปุ่มบนหน้ารายการฎีกา */
function addDekaPracticeBar(){
  dqInjectCSS();
  const old = document.getElementById("deka-practice-bar");
  if (old) old.remove();
  const title = document.getElementById("deka-list-title");
  if (!title) return;
  const bar = document.createElement("div");
  bar.id = "deka-practice-bar";
  bar.className = "dq-bar";
  bar.innerHTML = `
    <button class="primary" onclick="dqStart(false)">▶ เริ่มฝึกฝน</button>
    <button onclick="dqStart(true)">🔁 ทวนที่เคยผิด</button>
    <button onclick="dqStats()">📊 สถิติ</button>`;
  title.insertAdjacentElement("afterend", bar);
}

function dqStart(onlyWrong){
  const cat = DATA.categories[route.catKey];
  let list = (cat.dekaList || []).filter(d => d.quiz && d.quiz.options && d.quiz.options.length);
  const st = dqLoad();
  if (onlyWrong) list = list.filter(d => (st[d.title] || {}).wrong > 0);
  if (!list.length) { alert(onlyWrong ? "ยังไม่มีเรื่องที่เคยตอบผิด 🎉" : "ไม่มีข้อสอบฎีกาในหมวดนี้"); return; }
  dqS = { list: dqShuffle(list), i: 0, right: 0, wrong: 0, wrongItems: [], picked: null, order: null };
  dqPrepare();
  dqRender();
}

function dqPrepare(){
  const s = dqS;
  if (s.i >= s.list.length) return;
  s.order = dqShuffle(s.list[s.i].quiz.options.map((text, idx) => ({ text, idx })));
  s.picked = null;
}

function dqRender(){
  const s = dqS;
  if (s.i >= s.list.length) return dqSummary();
  const d = s.list[s.i], q = d.quiz, answered = s.picked !== null;
  const LET = ["ก", "ข", "ค", "ง", "จ", "ฉ"];
  const isRight = answered && s.order[s.picked].idx === q.correct;

  const opts = s.order.map((o, k) => {
    let cls = "";
    if (answered) {
      if (o.idx === q.correct) cls = "ok";
      else if (k === s.picked) cls = "bad";
      else cls = "dim";
    }
    return `<button class="dq-opt ${cls}" ${answered ? "disabled" : ""} onclick="dqAnswer(${k})">
      <span class="dq-key">${LET[k] || k + 1}</span><span>${dqEsc(o.text)}</span></button>`;
  }).join("");

  const chips = (d.tags || []).map(t => `<span class="dq-chip">${dqEsc(t)}</span>`).join("");

  dqOverlay(`<div class="dq-wrap">
    <div class="dq-top">
      <button class="dq-x" onclick="dqClose()">✕</button>
      <div class="dq-prog"><div style="width:${(s.i / s.list.length) * 100}%"></div></div>
      <div class="dq-score">${s.i + 1}/${s.list.length} · ✅${s.right} ❌${s.wrong}</div>
    </div>
    <div class="dq-card">
      <div class="dq-title">${dqEsc(d.title)}${d.statute ? " · 📖 " + dqEsc(d.statute) : ""}</div>
      ${chips ? `<div class="dq-chips">${chips}</div>` : ""}
      ${d.facts ? `<div class="dq-facts">${dqEsc(d.facts)}</div>` : ""}
      <p class="dq-q">${dqEsc(q.question)}</p>
      ${opts}
      ${answered ? `<div class="dq-fb" style="--c:var(${isRight ? "--ok" : "--bad"})">
        <b>${isRight ? "✅ ถูกต้อง" : "❌ ยังไม่ถูก"}</b>
        <div style="white-space:pre-wrap;margin-top:6px;">${dqEsc(q.explanation || d.principle || "")}</div></div>` : ""}
    </div>
  </div>
  ${answered ? `<div class="dq-foot"><button class="dq-next" onclick="dqNext()">
    ${s.i + 1 >= s.list.length ? "ดูสรุปผล 🏁" : "ข้อถัดไป ➡"}</button></div>` : ""}`);
}

function dqAnswer(k){
  const s = dqS;
  if (!s || s.picked !== null) return;
  const d = s.list[s.i];
  const ok = s.order[k].idx === d.quiz.correct;
  s.picked = k;
  const st = dqLoad();
  const rec = st[d.title] || { right: 0, wrong: 0, last: null };
  if (ok) { rec.right++; s.right++; } else { rec.wrong++; s.wrong++; s.wrongItems.push(d); }
  rec.last = ok ? "right" : "wrong";
  st[d.title] = rec;
  dqSave(st);
  dqRender();
}

function dqNext(){ dqS.i++; dqPrepare(); dqRender(); }

function dqSummary(){
  const s = dqS, total = s.right + s.wrong;
  const pct = total ? Math.round((s.right / total) * 100) : 0;
  dqOverlay(`<div class="dq-wrap">
    <div class="dq-card">
      <div class="dq-big">
        <div class="dq-ring" style="--p:${pct}"><span>${pct}%</span></div>
        <div style="font-size:1.1rem;">ถูก <b style="color:var(--ok)">${s.right}</b> · ผิด <b style="color:var(--bad)">${s.wrong}</b></div>
      </div>
      ${s.wrongItems.length
        ? `<h3 style="margin:8px 0 0;">เรื่องที่ควรทบทวน</h3>` + s.wrongItems.map(d => `<div class="dq-li"><span>${dqEsc(d.title)}</span></div>`).join("")
        : `<p style="text-align:center;">ตอบถูกทุกข้อ 🎉</p>`}
      <div class="dq-row">
        <button class="dq-btn p" onclick="dqStart(false)">▶ เล่นใหม่</button>
        <button class="dq-btn" onclick="dqStart(true)">🔁 ทวนที่เคยผิด</button>
        <button class="dq-btn" onclick="dqStats()">📊 สถิติรวม</button>
        <button class="dq-btn" onclick="dqClose()">ปิด</button>
      </div>
    </div></div>`);
}

function dqStats(){
  const st = dqLoad();
  const rows = Object.entries(st).map(([title, r]) => ({ title, ...r })).sort((a, b) => b.wrong - a.wrong);
  const R = rows.reduce((n, r) => n + r.right, 0), W = rows.reduce((n, r) => n + r.wrong, 0);
  dqOverlay(`<div class="dq-wrap">
    <div class="dq-top">
      <button class="dq-x" onclick="dqClose()">✕</button>
      <h2 style="margin:0;flex:1;">📊 สถิติฎีกาสำคัญ</h2>
    </div>
    <div class="dq-card">
      <p style="margin-top:0;">รวม <b style="color:var(--ok)">✅ ${R}</b> · <b style="color:var(--bad)">❌ ${W}</b> ${R + W ? `· ${Math.round(R / (R + W) * 100)}%` : ""}</p>
      ${rows.length ? rows.map(r => `<div class="dq-li">
        <div><div>${dqEsc(r.title)}</div><small>ล่าสุด: ${r.last === "right" ? "ถูก" : r.last === "wrong" ? "ผิด" : "-"}</small></div>
        <div style="display:flex;gap:6px;"><span class="dq-pill r">✅ ${r.right}</span><span class="dq-pill w">❌ ${r.wrong}</span></div>
      </div>`).join("") : "<p>ยังไม่มีสถิติ กดเริ่มฝึกฝนได้เลย</p>"}
      <div class="dq-row">
        <button class="dq-btn p" onclick="dqStart(false)">▶ เริ่มฝึกฝน</button>
        <button class="dq-btn d" onclick="dqReset()">🗑 ล้างสถิติหมวดนี้</button>
        <button class="dq-btn" onclick="dqExport()">⬇ Export</button>
<button class="dq-btn" onclick="dqImport()">⬆ Import</button>
      </div>
    </div></div>`);
}
function dqReset(){ if (confirm("ล้างสถิติของหมวดนี้ทั้งหมด?")) { dqSave({}); dqStats(); } }

/* คีย์ลัด: กด 1-4 เลือกข้อ, Enter/Space ไปข้อถัดไป */
document.addEventListener("keydown", e => {
  if (!document.getElementById("dq-ov") || !dqS || dqS.i >= dqS.list.length) return;
  if (dqS.picked === null && /^[1-6]$/.test(e.key) && dqS.order[+e.key - 1]) dqAnswer(+e.key - 1);
  else if (dqS.picked !== null && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); dqNext(); }
});

function render() {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  const screenEl = document.getElementById(route.screen);
  if (screenEl) screenEl.classList.add("active");
  window.scrollTo(0, 0);  document.getElementById("app").style.maxWidth = route.screen === "screen-graph" ? "1100px" : "";

  const cat = route.catKey ? DATA.categories[route.catKey] : null;

  if (route.screen === "screen-category") buildCategoryMenu();
  else if (route.screen === "screen-home" && cat) buildHomeContent(cat);
  else if (route.screen === "screen-overview" && cat) buildOverviewScreen(cat);
  else if (route.screen === "screen-flash" && cat) {
    buildFlashSearchUI(cat);
    renderCard(cat);
  }
  else if (route.screen === "screen-deka-list" && cat) {
    document.getElementById("deka-list-title").innerText = `ฎีกาสำคัญ — ${cat.label}`;
    buildDekaSearchUI(cat);
    buildDekaItems(cat);
    addDekaPracticeBar();
  }
  else if (route.screen === "screen-deka-view" && cat) viewDekaRender(cat);
  else if (route.screen === "screen-writing-list" && cat) buildWritingItems(cat);
  else if (route.screen === "screen-writing-view" && cat) openWritingRender(cat);
  else if (route.screen === "screen-graph") initGraph();
}

  try {
    const t = localStorage.getItem("slb_theme"); if (t) document.body.dataset.theme = t;
    const f = parseFloat(localStorage.getItem("slb_font")); if (f) { currentFontSize = f; document.getElementById("app").style.fontSize = f + "rem"; }
  } catch(e){}
}
function toggleTheme() {
  document.body.dataset.theme = document.body.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem("slb_theme", document.body.dataset.theme); } catch(e){}
}
function changeFontSize(delta) {
  currentFontSize = Math.min(1.6, Math.max(0.8, currentFontSize + delta));
  document.getElementById("app").style.fontSize = currentFontSize + "rem";
  try { localStorage.setItem("slb_font", currentFontSize); } catch(e){}

  currentFontSize = Math.min(1.6, Math.max(0.8, currentFontSize + delta));
  document.getElementById("app").style.fontSize = currentFontSize + "rem";
}

/* ============================================================
   หน้าแรกจัดกลุ่มตามประมวลกฎหมาย + ปุ่มภาพรวมประมวล
   ============================================================ */
function groupCategories() {
  const groupDefs = DATA.groups || {};
  const groups = {};
  Object.entries(DATA.categories).forEach(([key, cat]) => {
    const gKey = cat.group || "_ungrouped";
    if (!groups[gKey]) {
      const def = groupDefs[gKey] || {};
      groups[gKey] = {
    key: gKey,
    label: def.label || (
        gKey === "criminal"
            ? "กฎหมายอาญา"
            : "กฎหมายแพ่งและพาณิชย์"
    ),
    icon: def.icon || (
        gKey === "criminal"
            ? "➤"
            : "➤"
    ),
    mindmapNodes: def.mindmapNodes || null,
    catKeys: []
};
      
    }
    groups[gKey].catKeys.push(key);
  });
  return groups;
}

function buildCategoryMenu() {
  const groups = groupCategories();
  const allKeys = Object.keys(DATA.categories);
  document.getElementById("category-grid").innerHTML = Object.values(groups).map(g => `
    <div class="group-block content-block">
      <div class="group-header">
        <h3><span class="g-dot"></span>${escHTML(g.label)}</h3>
        <button class="btn-mindmap" onclick="openGroupMindmap('${escJS(g.key)}')">ภาพรวมประมวล</button>
      </div>
      <div class="menu-grid">
        ${g.catKeys.map(key => {
          const cat = DATA.categories[key];
          return `
            <button class="main-btn" style="--nc:${catColor(key)}" onclick="selectCategory('${escJS(key)}')">
              <div class="icon-box node-ico">${nodeIcon(allKeys.indexOf(key))}</div>
              <div><h3 style="margin:0;">${escHTML(cat.label)}</h3>
                   <p style="margin:0;font-size:0.8rem;color:var(--text-sub);">${(cat.flashCards||[]).length} มาตรา</p></div>
            </button>`;
        }).join("")}
      </div>
    </div>`).join("");

  const st = document.getElementById("graph-cta-stat");
  if (st && GRAPH) st.textContent = `${GRAPH.nodes.filter(n => n.type !== "tag").length} โหนด · ${GRAPH.links.filter(l => l.kind !== "tagged").length} เส้นเชื่อม`;
}

function renderMindmapTree(nodes) {
  return `<ul class="mindmap-tree root-list">${nodes.map(n => `
    <li>
      <span class="tree-label">${escHTML(n.label)}</span>
      ${n.children && n.children.length ? `<ul>${n.children.map(c => `<li><span class="tree-label">${escHTML(c.label)}</span></li>`).join("")}</ul>` : ""}
    </li>`).join("")}</ul>`;
}

function openGroupMindmap(gKey) {
  const groups = groupCategories();
  const g = groups[gKey];
  if (!g) return;
  let nodes = g.mindmapNodes;
  if (!nodes) {
    nodes = g.catKeys.map(key => {
      const cat = DATA.categories[key];
      const subCats = [...new Set((cat.flashCards || []).map(c => c.category).filter(Boolean))];
      return { label: cat.label, children: subCats.map(c => ({ label: c })) };
    });
  }
  document.getElementById("mindmap-modal-title").innerText = `ภาพรวม ${g.label}`;
  document.getElementById("mindmap-modal-body").innerHTML = renderMindmapTree(nodes);
  document.getElementById("mindmap-modal").classList.add("active");
}
function closeMindmapModal() {
  document.getElementById("mindmap-modal").classList.remove("active");
}
function dqProgress(key, cat){
  let st = {}; try { st = JSON.parse(localStorage.getItem("dekaStats_" + key) || "{}"); } catch(e){}
  const rows = Object.values(st);
  const total = (cat.dekaList || []).length;
  const R = rows.reduce((n, r) => n + r.right, 0), W = rows.reduce((n, r) => n + r.wrong, 0);
  return { total, done: rows.length, pct: R + W ? Math.round(R / (R + W) * 100) : null };
}
function dqExport(){
  const out = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith("dekaStats_")) { try { out[k] = JSON.parse(localStorage.getItem(k)); } catch(e){} }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: "application/json" }));
  a.download = "deka-stats-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click(); URL.revokeObjectURL(a.href);
}
function dqImport(){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "application/json";
  inp.onchange = async () => {
    try {
      const data = JSON.parse(await inp.files[0].text());
      Object.entries(data).forEach(([k, v]) => {
        if (!k.startsWith("dekaStats_")) return;
        const cur = JSON.parse(localStorage.getItem(k) || "{}");
        Object.entries(v).forEach(([t, r]) => {
          const c = cur[t];
          cur[t] = c ? { right: Math.max(c.right, r.right), wrong: Math.max(c.wrong, r.wrong), last: r.last } : r;
        });
        localStorage.setItem(k, JSON.stringify(cur));
      });
      alert("นำเข้าสำเร็จ"); dqStats();
    } catch(e) { alert("ไฟล์ไม่ถูกต้อง"); }
  };
  inp.click();
}

/* ============================================================
   ภาพรวมวิชา (บรรพ > ลักษณะ > หมวด > ส่วน > มาตรา)
   ------------------------------------------------------------
   ค่า default จะแสดง "เฉพาะหัวข้อลักษณะ" เท่านั้น (ยุบ/พับไว้)
   ผู้ใช้ต้องแตะที่ชื่อลักษณะเพื่อขยายดู หมวด/ส่วน/มาตรา ข้างใน
   ถ้า cat.overview.root ถูกกำหนดไว้ตรงๆ ใน data.json จะใช้ค่านั้น
   ถ้าไม่มี จะ auto-generate จาก flashCards โดยอ่าน field ต่อไปนี้
   ของแต่ละการ์ด (ทุก field เป็น optional, มี fallback):
     card.book      -> ชื่อบรรพ  (เช่น "บรรพ 1 หลักทั่วไป")
     card.category  -> ชื่อลักษณะ (เช่น "ลักษณะ 2 บุคคล")   [ใช้ field เดิม]
     card.chapter   -> ชื่อหมวด   (เช่น "หมวด 1 บุคคลธรรมดา")
     card.part      -> ชื่อส่วน   (เช่น "ส่วนที่ 1 สภาพบุคคล")
     card.section   -> เลขมาตรา (ใช้ jump ไป Flash Card)

   ฟังก์ชัน buildOverviewRoot / renderOverviewTree ชุดนี้ยังถูกใช้ซ้ำ
   เป็นต้นไม้ "ค้นหาตามหมวด/ลักษณะ" ของ Flash Card (แท็บ browse)
   เพื่อให้พฤติกรรมเหมือนกันทุกจุด: โชว์ "ลักษณะ" ก่อน (ยุบ)
   แตะแล้วค่อยขยายเป็น หมวด/ส่วน/มาตรา (ก็ยุบซ้อนอยู่ข้างในเช่นกัน)
   ============================================================ */
function buildOverviewRoot(cat) {
  if (cat.overview && cat.overview.root) return cat.overview.root;

  const NO_BOOK = "ทั้งหมด";
  const bookMap = new Map(); // book -> Map(title -> Map(chapter -> Map(part -> [cards])))

  (cat.flashCards || []).forEach(card => {
    const bookKey    = card.book || NO_BOOK;
    const titleKey   = card.category || "ไม่ระบุลักษณะ";
    const chapterKey = card.chapter || "";
    const partKey    = card.part || "";

    if (!bookMap.has(bookKey)) bookMap.set(bookKey, new Map());
    const titleMap = bookMap.get(bookKey);

    if (!titleMap.has(titleKey)) titleMap.set(titleKey, new Map());
    const chapterMap = titleMap.get(titleKey);

    if (!chapterMap.has(chapterKey)) chapterMap.set(chapterKey, new Map());
    const partMap = chapterMap.get(chapterKey);

    if (!partMap.has(partKey)) partMap.set(partKey, []);
    partMap.get(partKey).push(card);
  });

  const books = [...bookMap.entries()].map(([bookLabel, titleMap]) => {
    const titles = [...titleMap.entries()].map(([titleLabel, chapterMap]) => {
      const chapters = [...chapterMap.entries()].map(([chapterLabel, partMap]) => {
        const parts = [...partMap.entries()].map(([partLabel, cards]) => ({
          label: partLabel,
          sections: cards.map(c => ({
            label: `${c.title || ""}`.trim() || `มาตรา ${c.section}`,
            section: c.section,
          })),
        }));
        // ช่วงมาตราของหมวดนี้ (สำหรับแสดงบอกช่วงเลขมาตรา)
        const allSecs = parts.flatMap(p => p.sections.map(s => s.section)).filter(Boolean);
        return { label: chapterLabel, parts, range: sectionRangeLabel(allSecs) };
      });
      const allSecsTitle = chapters.flatMap(c => c.parts.flatMap(p => p.sections.map(s => s.section))).filter(Boolean);
      return { label: titleLabel, chapters, range: sectionRangeLabel(allSecsTitle) };
    });
    return { label: bookLabel, titles, showBookLabel: bookLabel !== NO_BOOK };
  });

  return { books };
}

function sectionRangeLabel(secs) {
  if (!secs || secs.length === 0) return "";
  // เรียงตามตัวเลขมาตรา (รองรับรูปแบบ "193/1" ด้วยการเทียบเป็นตัวเลขคร่าวๆ)
  const toNum = s => parseFloat(String(s).replace("/", "."));
  const sorted = [...secs].sort((a, b) => toNum(a) - toNum(b));
  const first = sorted[0], last = sorted[sorted.length - 1];
  return first === last ? `ม.${first}` : `ม.${first}–${last}`;
}

/**
 * เรนเดอร์ต้นไม้ภาพรวม: แสดงเฉพาะหัวข้อ "ลักษณะ" ตอนเปิดหน้า (พับหมวด/ส่วน/มาตราไว้)
 * ใช้ <details>/<summary> ของ native HTML เพื่อ toggle เปิด-ปิดโดยไม่ต้องเขียน JS state เพิ่ม
 * ใช้ร่วมกันทั้งหน้า "ภาพรวมวิชา" และแท็บ "ค้นหาตามหมวด/ลักษณะ" ของ Flash Card
 */
function renderOverviewTree(root) {
  const books = root.books || [];
  return books.map(book => `
    <div class="ov-book">
      ${book.showBookLabel ? `<div class="ov-book-title">${escHTML(book.label)}</div>` : ""}
      ${book.titles.map(renderTitleNode).join("")}
    </div>`).join("");
}

function renderTitleNode(title) {
  return `
    <details class="ov-title-node">
      <summary class="ov-title-summary">
        <span>${escHTML(title.label)} ${title.range ? `<span class="ov-range">${escHTML(title.range)}</span>` : ""}</span>
        <span class="ov-caret">▶</span>
      </summary>
      <div class="ov-title-body">
        ${title.chapters.map(renderChapterNode).join("")}
      </div>
    </details>`;
}

function renderChapterNode(chapter) {
  // ถ้าไม่มีชื่อหมวด (การ์ดไม่ได้ระบุ chapter) ให้ข้ามชั้นหมวด แสดงส่วน/มาตราตรงๆ
  const hasChapterLabel = Boolean(chapter.label);
  const body = chapter.parts.map(renderPartNode).join("");
  if (!hasChapterLabel) return body;
  return `
    <details class="ov-chapter">
      <summary class="ov-chapter-summary">
        ${escHTML(chapter.label)} ${chapter.range ? `<span class="ov-range">${escHTML(chapter.range)}</span>` : ""}
      </summary>
      <div class="ov-chapter-body">${body}</div>
    </details>`;
}

function renderPartNode(part) {
  const label = part.label ? `<div class="ov-part-label">${escHTML(part.label)}</div>` : "";
  const btns = part.sections.map(s => `
    <button type="button" class="ov-section-btn" onclick="jumpToSectionFromOverview('${escJS(s.section)}')" title="ไปดู Flash Card มาตรานี้">
      ม.${escHTML(s.section)}
    </button>`).join("");
  return `<div>${label}<div>${btns}</div></div>`;
}

function buildOverviewScreen(cat) {
  document.getElementById("overview-title").innerText = `🗺️ ภาพรวมวิชา: ${cat.label}`;
  const root = buildOverviewRoot(cat);
  document.getElementById("overview-body").innerHTML = renderOverviewTree(root);
}

function jumpToSectionFromOverview(section) {
  const cat = DATA.categories[route.catKey];
  if (!cat) return;
  const idx = (cat.flashCards || []).findIndex(c => String(c.section) === String(section));
  go({ screen: "screen-flash", cardIdx: idx >= 0 ? idx : 0, pageIdx: 0, flashTab: "keyword" });
}

   Tabs Search System — ใช้ร่วมกันหน้า Flash และ Deka
